<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chicken Story</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
#stage{width:360px;height:640px;background:linear-gradient(#FFE4B5,#FFB6C1);border:4px solid white;border-radius:20px;position:relative;overflow:hidden}
.chicken{position:absolute;font-size:80px;animation: bounce 1s infinite alternate}
@keyframes bounce{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
#saas{left:50px;top:200px}
#bahu{right:50px;top:200px;animation-delay:0.5s}
.text{position:absolute;bottom:100px;left:10%;width:80%;background:white;padding:15px;border-radius:20px;text-align:center;font-weight:bold;font-size:20px;animation: pop 0.5s}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.sub{position:absolute;bottom:10px;width:100%;text-align:center;color:#333}
button{margin-top:20px;padding:15px 40px;font-size:18px;border-radius:30px;border:none;background:#ff4757;color:white;font-weight:bold;box-shadow:0 5px 0 #c0392b}
</style>
</head>
<body>
<div id="stage">
<div class="chicken" id="saas">🐔👵</div>
<div class="chicken" id="bahu">🐔👩</div>
<div class="text" id="txt">Saas: WhatsApp par Big Trouble!</div>
<div class="sub" id="sno">Scene 1: Live Animation</div>
</div>
<button onclick="next()">Next Scene -></button>
<script>
let s=0;
const scenes=[
{txt:"Saas: Arre WhatsApp par kya aa gaya?", saas:"🐔😱", bahu:"🐔👵"},
{txt:"Bahu: Amma ruko mai dekhti hun!", saas:"🐔🤔", bahu:"🐔💁‍♀️"},
{txt:"Saas: Mera WhatsApp kis ne kharab kiya?", saas:"🐔🤬", bahu:"🐔😅"},
{txt:"Bahu ne sab theek kar diya! ❤️", saas:"🐔😍", bahu:"🐔🥰"},
];
function next(){ s=(s+1)%scenes.length; document.getElementById('txt').innerText=scenes[s].txt; document.getElementById('saas').innerText=scenes[s].saas; document.getElementById('bahu').innerText=scenes[s].bahu; document.getElementById('sno').innerText="Scene "+(s+1)+" Live"; }
</script>
</body>
</html>
