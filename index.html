<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Story</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
h1{position:fixed;top:10px;width:100%;text-align:center;font-family:cursive;color:#333;z-index:10}
</style>
</head>
<body>
<h1>✨ Stickman Village ✨</h1>
<canvas id="c"></canvas>
<script>
let C=document.getElementById('c'),X=C.getContext('2d');
function R(){C.width=innerWidth;C.height=innerHeight}R();
addEventListener('resize',R);
let t=0, sx2=130, dir=1, step=0;
function draw(){
t+=0.14; step+=0.2;
X.clearRect(0,0,C.width,C.height);
X.fillStyle='#87CEEB';X.fillRect(0,0,C.width,C.height);
X.fillStyle='#7AC87A';X.fillRect(0,C.height-80,C.width,80);

// === SURAJ right side ===
let sunX=C.width-110, sunY=95;
X.save();X.translate(sunX,sunY);X.rotate(t*0.02);
X.strokeStyle='#FFD700';X.lineWidth=4;
for(let i=0;i<12;i++){X.rotate(Math.PI/6);X.beginPath();X.moveTo(55,0);X.lineTo(75,0);X.stroke();}
X.restore();
X.fillStyle='#FFD700';X.beginPath();X.arc(sunX,sunY,48,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(sunX-14,sunY-8,4,0,6.28);X.arc(sunX+14,sunY-8,4,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.arc(sunX,sunY+10,13,0.2,Math.PI-0.2);X.stroke();

// === GHAR SURAJ WALI SIDE (right corner) ===
let hx=C.width-150, hy=C.height-210;
X.fillStyle='#FFE4B5';X.fillRect(hx,hy,110,90);
X.fillStyle='#E74C3C';X.beginPath();X.moveTo(hx-10,hy);X.lineTo(hx+55,hy-40);X.lineTo(hx+120,hy);X.closePath();X.fill();
X.fillStyle='#8B4513';X.fillRect(hx+45,hy+45,25,45);
X.fillStyle='#87CEEB';X.strokeStyle='#8B4513';X.lineWidth=2;
X.fillRect(hx+10,hy+15,25,25);X.strokeRect(hx+10,hy+15,25,25);
X.fillRect(hx+75,hy+15,25,25);X.strokeRect(hx+75,hy+15,25,25);
X.fillStyle='#666';X.fillRect(hx+75,hy-25,12,30);

// === BENCH center ===
let bx=C.width*0.5-70, by=C.height-140;
X.fillStyle='#8B4513';X.fillRect(bx,by,150,8);X.fillRect(bx,by+28,150,8);
X.fillRect(bx+8,by+8,12,40);X.fillRect(bx+130,by+8,12,40);

// === AURAT sticky with lips ===
let wx=bx+75, wy=by;
X.strokeStyle='black';X.lineWidth=3.5;X.lineCap='round';
X.beginPath();X.arc(wx,wy-42,16,0,6.28);X.stroke();
X.beginPath();X.arc(wx-4,wy-48,16,Math.PI*0.8,Math.PI*1.8);X.stroke();
X.beginPath();X.moveTo(wx,wy-26);X.lineTo(wx,wy+2);X.stroke();
X.beginPath();X.moveTo(wx-14,wy+2);X.lineTo(wx+14,wy+2);X.lineTo(wx+10,wy+16);X.lineTo(wx-10,wy+16);X.closePath();X.stroke();
X.beginPath();X.moveTo(wx-7,wy+16);X.lineTo(wx-7,wy+28);X.lineTo(wx-14,wy+28);X.stroke();
X.beginPath();X.moveTo(wx+7,wy+16);X.lineTo(wx+7,wy+28);X.lineTo(wx+14,wy+28);X.stroke();
X.beginPath();X.moveTo(wx,wy-18);X.lineTo(wx-18,wy-5);X.moveTo(wx,wy-18);X.lineTo(wx+18,wy-5);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(wx-5,wy-45,2,0,6.28);X.arc(wx+5,wy-45,2,0,6.28);X.fill();
let m1=Math.abs(Math.sin(t*0.4+1))*6+1;
X.fillStyle='#FF3366';X.beginPath();X.ellipse(wx,wy-34,6,m1,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1;X.stroke();

// === BILI door ===
let cx=bx+200, cy=C.height-85;
let tailWag=Math.sin(t)*1.2;
X.fillStyle='orange';X.beginPath();X.arc(cx,cy-15,13,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(cx-4,cy-18,2,0,6.28);X.arc(cx+4,cy-18,2,0,6.28);X.fill();
X.fillStyle='orange';
X.beginPath();X.moveTo(cx-9,cy-24);X.lineTo(cx-13,cy-33);X.lineTo(cx-3,cy-27);X.fill();
X.beginPath();X.moveTo(cx+9,cy-24);X.lineTo(cx+13,cy-33);X.lineTo(cx+3,cy-27);X.fill();
X.beginPath();X.ellipse(cx,cy,17,9,0,0,6.28);X.fill();
X.strokeStyle='orange';X.lineWidth=5;X.lineCap='round';
X.beginPath();X.moveTo(cx+17,cy);
X.quadraticCurveTo(cx+28+tailWag*12,cy-12,cx+38,cy+4-Math.sin(t*1.5)*6);
X.stroke();

// === STICKMAN CHALTA HUA ===
let sy2=C.height-80;
// walk
sx2+=dir*1.2;
if(sx2>C.width*0.4 || sx2<80) dir*=-1;
let leg1=Math.sin(step)*18, leg2=Math.sin(step+Math.PI)*18;
let arm1=Math.sin(step)*15, arm2=Math.sin(step+Math.PI)*15;

X.strokeStyle='black';X.lineWidth=3.5;
X.beginPath();X.arc(sx2,sy2-100,20,0,6.28);X.stroke();
X.beginPath();X.moveTo(sx2,sy2-80);X.lineTo(sx2,sy2-35);X.stroke();
// arms hilte
X.beginPath();X.moveTo(sx2,sy2-65);X.lineTo(sx2-20+arm1*0.3,sy2-50);X.moveTo(sx2,sy2-65);X.lineTo(sx2+20+arm2*0.3,sy2-50);X.stroke();
// legs chalte
X.beginPath();X.moveTo(sx2,sy2-35);X.lineTo(sx2-10+leg1,sy2);X.moveTo(sx2,sy2-35);X.lineTo(sx2+10+leg2,sy2);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(sx2-7,sy2-105,2,0,6.28);X.arc(sx2+7,sy2-105,2,0,6.28);X.fill();
let m2=Math.abs(Math.sin(t*0.55))*7+2;
X.fillStyle='#FF4444';X.beginPath();X.ellipse(sx2,sy2-90,7,m2,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1;X.stroke();

requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
