<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:white;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column}
canvas{border:2px solid black;width:350px;height:500px}
button{padding:12px 25px;background:black;color:white;border-radius:8px;margin-top:15px;font-size:16px}
#t{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<canvas id="c" width="350" height="500"></canvas>
<div id="t">Scene 1: Faqeer bheek mang raha hai</div>
<button onclick="n()">Next Scene -></button>
<script>
let s=1;let canvas=document.getElementById("c");let x=canvas.getContext("2d");
function d(){
x.clearRect(0,0,350,500);
x.fillStyle="#ccc";x.fillRect(0,400,350,100);
x.strokeStyle="black";x.fillStyle="black";x.font="14px Arial";
if(s==1){x.beginPath();x.arc(175,200,20,0,7);x.stroke();x.moveTo(175,220);x.lineTo(175,300);x.stroke();x.fillText("Bheek de do..",120,380);document.getElementById("t").innerText="Scene 1: Faqeer bheek mang raha hai"}
if(s==2){x.beginPath();x.arc(120,200,20,0,7);x.stroke();x.beginPath();x.arc(230,200,20,0,7);x.stroke();x.fillStyle="cyan";x.beginPath();x.arc(175,250,10,0,7);x.fill();x.fillStyle="black";x.fillText("Ye Diamond lo",130,140);document.getElementById("t").innerText="Scene 2: Diamond de raha hai"}
if(s==3){x.fillText("Tumne meri jaan bachayi thi",70,100);x.beginPath();x.arc(175,250,20,0,7);x.stroke();document.getElementById("t").innerText="Scene 3: Yaad - Zakhmii ki madad ki thi"}
if(s==4){x.beginPath();x.arc(175,180,20,0,7);x.stroke();x.fillStyle="gold";x.beginPath();x.moveTo(160,160);x.lineTo(190,160);x.lineTo(175,140);x.fill();x.fillStyle="black";x.fillText("Main Ameer ban gaya!",100,100);document.getElementById("t").innerText="Scene 4: Faqeer Ameer ho gaya!"}
}
function n(){s++;if(s>4)s=1;d();}d();
</script>
</body>
</html>
