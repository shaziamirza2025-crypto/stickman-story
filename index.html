<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden With Message</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#87CEEB}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
function resize(){cv.width=innerWidth; cv.height=innerHeight;} addEventListener('resize',resize); resize();
let t=0, falling=[]; for(let i=0;i<25;i++) falling.push({x:Math.random()*400, y:Math.random()*400, vx:(Math.random()-0.5)*0.7, vy:Math.random()*1+0.4, r:Math.random()*4+3});
let birds=[]; for(let i=0;i<6;i++) birds.push({x:Math.random()*cv.width, y:50+Math.random()*150, vx:0.5+Math.random()*1, wing:Math.random()*10});
let flowers=[]; for(let i=0;i<70;i++) flowers.push({x:0, y:0, type:Math.floor(Math.random()*3)});
let drops=[];

function draw(){
 t+=0.03; let W=cv.width, H=cv.height;
 x.fillStyle="#87CEEB"; x.fillRect(0,0,W,H*0.6);
 x.fillStyle="#7CFC00"; x.fillRect(0,H*0.6,W,H*0.4);
 let sunX=W-110,sunY=110;
 x.strokeStyle="rgba(255,215,0,0.8)"; x.lineWidth=4; for(let i=0;i<12;i++){let a=(i/12)*Math.PI*2+t; x.beginPath(); x.moveTo(sunX+Math.cos(a)*42,sunY+Math.sin(a)*42); x.lineTo(sunX+Math.cos(a)*68,sunY+Math.sin(a)*68); x.stroke();}
 x.fillStyle="#FFD700"; x.beginPath(); x.arc(sunX,sunY,42,0,7); x.fill();
 x.fillStyle="white"; x.beginPath(); x.arc(sunX-11,sunY-7,8,0,7); x.arc(sunX+11,sunY-7,8,0,7); x.fill();
 x.fillStyle="black"; x.beginPath(); x.arc(sunX-11+Math.sin(t*2)*2,sunY-6,3,0,7); x.arc(sunX+11+Math.sin(t*2)*2,sunY-6,3,0,7); x.fill();
 x.strokeStyle="black"; x.lineWidth=2.5; x.beginPath(); x.arc(sunX,sunY+11,13,0.2,Math.PI-0.2); x.stroke();

 // BIRDS in sky 🕊️
 birds.forEach(b=>{
   b.x+=b.vx; b.y+=Math.sin(t+b.wing)*0.3; b.wing+=0.3;
   if(b.x>W+30) b.x=-30;
   let wx=Math.sin(b.wing)*8;
   x.strokeStyle="black"; x.lineWidth=2; x.lineCap="round";
   x.beginPath(); x.moveTo(b.x-8,b.y); x.quadraticCurveTo(b.x-4,b.y+wx, b.x, b.y);
   x.moveTo(b.x,b.y); x.quadraticCurveTo(b.x+4,b.y+wx, b.x+8,b.y); x.stroke();
 });

 let hx=W/2-100, hy=H*0.6-160;
 x.fillStyle="#FFE4B5"; x.fillRect(hx,hy,200,160); x.strokeStyle="#8B4513"; x.lineWidth=3; x.strokeRect(hx,hy,200,160);
 x.fillStyle="#B22222"; x.beginPath(); x.moveTo(hx-10,hy); x.lineTo(hx+100,hy-70); x.lineTo(hx+210,hy); x.closePath(); x.fill(); x.stroke();
 x.fillStyle="#8B4513"; x.fillRect(hx+70,hy+90,50,70);

 flowers.forEach(f=>{
   if(f.x==0){f.x=Math.random()*W; f.y=H*0.6+20+Math.random()*(H*0.4-30);}
   x.strokeStyle="#2E7D32"; x.lineWidth=2; x.beginPath(); x.moveTo(f.x,f.y); x.lineTo(f.x,f.y+12); x.stroke();
   x.fillStyle=f.type==0?"#FF69B4":f.type==1?"#FF0000":"#FFD700"; x.beginPath(); x.arc(f.x,f.y,6,0,7); x.fill();
   x.fillStyle="yellow"; x.beginPath(); x.arc(f.x,f.y,2,0,7); x.fill();
 });

 let s1=Math.sin(t)*4, tx1=50+s1, ty1=H*0.6;
 x.fillStyle="#5D4037"; x.fillRect(tx1,ty1-190,22,190);
 x.fillStyle="#1B5E20"; x.beginPath(); x.arc(tx1+11,ty1-200,58,0,7); x.fill();
 x.fillStyle="#81C784"; for(let i=0;i<12;i++){let a=(i/12)*Math.PI*2+t; x.beginPath(); x.arc(tx1+11+Math.cos(a)*35, ty1-200+Math.sin(a)*35, 8,0,7); x.fill();}
 let s2=Math.cos(t*1.1)*3, tx2=W-130+s2;
 x.fillStyle="#5D4037"; x.fillRect(tx2,ty1-170,20,170);
 x.fillStyle="#1B5E20"; x.beginPath(); x.arc(tx2+10,ty1-180,52,0,7); x.fill();
 x.fillStyle="#81C784"; for(let i=0;i<10;i++){let a=(i/10)*Math.PI*2+t; x.beginPath(); x.arc(tx2+10+Math.cos(a)*30, ty1-180+Math.sin(a)*30, 7,0,7); x.fill();}

 // BENCH
 let benchX=hx+220, benchY=ty1-10;
 x.fillStyle="#4E342E"; x.fillRect(benchX+5,benchY+5,8,25); x.fillRect(benchX+67,benchY+5,8,25);
 x.fillStyle="#8D6E63"; x.fillRect(benchX,benchY,80,8); x.strokeStyle="#3E2723"; x.lineWidth=2; x.strokeRect(benchX,benchY,80,8);
 x.fillStyle="#A1887F"; x.fillRect(benchX,benchY-18,80,6); x.strokeRect(benchX,benchY-18,80,6);
 x.fillRect(benchX,benchY-28,80,6); x.strokeRect(benchX,benchY-28,80,6);
 x.fillStyle="#4E342E"; x.fillRect(benchX+5,benchY-28,8,33); x.fillRect(benchX+67,benchY-28,8,33);

 // BILLI ON BENCH
 let catX=benchX+40, catY=benchY-18, tailWag=Math.sin(t*3)*10;
 x.fillStyle="#FFA726"; x.beginPath(); x.ellipse(catX,catY,24,15,0,0,7); x.fill();
 x.fillStyle="#FFA726"; x.beginPath(); x.arc(catX+18,catY-10,16,0,7); x.fill();
 x.fillStyle="#FFA726"; x.beginPath(); x.moveTo(catX+9,catY-21); x.lineTo(catX+12,catY-30); x.lineTo(catX+18,catY-20); x.fill();
 x.beginPath(); x.moveTo(catX+23,catY-22); x.lineTo(catX+27,catY-31); x.lineTo(catX+31,catY-20); x.fill();
 let eyeClose=Math.sin(t*2)>0.9?1:0;
 if(eyeClose==0){ x.fillStyle="white"; x.beginPath(); x.arc(catX+14,catY-11,4.5,0,7); x.arc(catX+23,catY-11,4.5,0,7); x.fill(); x.fillStyle="#2E7D32"; x.beginPath(); x.arc(catX+14,catY-11,2,0,7); x.arc(catX+23,catY-11,2,0,7); x.fill(); }
 else { x.strokeStyle="black"; x.lineWidth=2; x.beginPath(); x.moveTo(catX+10,catY-11); x.lineTo(catX+18,catY-11); x.moveTo(catX+19,catY-11); x.lineTo(catX+27,catY-11); x.stroke(); }
 x.fillStyle="pink"; x.beginPath(); x.arc(catX+19,catY-7,1.8,0,7); x.fill();
 x.strokeStyle="#FFA726"; x.lineWidth=8; x.lineCap="round"; x.beginPath(); x.moveTo(catX-22,catY); x.quadraticCurveTo(catX-42+tailWag,catY-10, catX-38,catY-22); x.stroke();

 // WATER TAP in corner 💧
 let tapX=30, tapY=H-110;
 // pipe
 x.fillStyle="#78909C"; x.fillRect(tapX, tapY, 10, 50);
 x.fillRect(tapX-15, tapY, 40, 12);
 // tap body
 x.fillStyle="#B0BEC5"; x.beginPath(); x.arc(tapX+5, tapY+6, 12,0,7); x.fill();
 x.strokeStyle="#546E7A"; x.lineWidth=2; x.beginPath(); x.arc(tapX+5, tapY+6, 12,0,7); x.stroke();
 // tap mouth
 x.fillStyle="#90A4AE"; x.fillRect(tapX+15, tapY+2, 18, 8);
 // bucket below
 x.fillStyle="#64B5F6"; x.fillRect(tapX-5, tapY+55, 35, 25); x.strokeStyle="#1976D2"; x.lineWidth=2; x.strokeRect(tapX-5, tapY+55, 35, 25);
 x.fillStyle="rgba(100,181,246,0.3)"; x.fillRect(tapX-5, tapY+55, 35, 25);
 // water drops falling - LEAK
 if(Math.random()<0.15) drops.push({x:tapX+32, y:tapY+10, vy:1, life:0});
 drops.forEach((d,i)=>{
   d.y+=d.vy; d.vy+=0.15; d.life++;
   x.fillStyle="#03A9F4"; x.beginPath(); x.arc(d.x, d.y, 4,0,7); x.fill();
   x.fillStyle="white"; x.beginPath(); x.arc(d.x-1, d.y-1, 1.2,0,7); x.fill();
   if(d.y>tapY+58) {drops.splice(i,1);}
 });
 // small puddle splash
 x.fillStyle="rgba(3,169,244,0.5)"; x.beginPath(); x.arc(tapX+12, tapY+58, 6+Math.sin(t*5)*1,0,7); x.fill();

 // TEXT - English Message 💙
 x.fillStyle="rgba(255,255,255,0.85)"; x.fillRect(10, H-48, 260, 38); x.strokeStyle="#0288D1"; x.lineWidth=2; x.strokeRect(10, H-48, 260, 38);
 x.fillStyle="#01579B"; x.font="bold 12px Arial"; x.fillText("Don't waste water,", 18, H-32);
 x.font="bold 11px Arial"; x.fillStyle="#0277BD"; x.fillText("Water is Life! 💧", 18, H-18);

 falling.forEach(l=>{l.y+=l.vy; l.x+=l.vx+Math.sin(t+l.x)*0.5; if(l.y>H){l.y=H*0.3; l.x=Math.random()*W;} x.fillStyle="rgba(76,175,80,0.8)"; x.beginPath(); x.ellipse(l.x,l.y,l.r,l.r*0.6,Math.sin(t+l.x),0,7); x.fill();});
 requestAnimationFrame(draw);
}
draw();
</script></body></html>
