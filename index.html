<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pani Bachao - Video Final</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:cursive}
canvas{width:100vw;height:100vh;display:block}
h1{position:fixed;top:6px;width:100%;text-align:center;color:#333;z-index:10;font-size:17px}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;background:white;padding:10px 18px;border-radius:25px;box-shadow:0 0 15px rgba(0,0,0,0.3);display:flex;gap:8px}
#controls button{padding:10px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px}
#recBtn{background:#F44336;color:white}
#recBtn.recording{background:#4CAF50;animation:pulse 1s infinite}
#autoBtn{background:#9C27B0;color:white}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
#timer{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:6px 14px;border-radius:15px;display:none;z-index:30;font-size:13px}
</style>
</head>
<body>
<h1>💧 Pani Bachao - Story 💧</h1>
<div id="timer">⏺️ Recording: <span id="time">0s</span></div>
<div id="controls">
<button id="recBtn" onclick="toggleRecording()">🔴 Normal Record</button>
<button id="autoBtn" onclick="autoRecord()">🎬 Auto Full Story Record (15s)</button>
<button onclick="resetStory()" style="background:#2196F3;color:white">🔄 Restart</button>
</div>
<canvas id="c"></canvas>
<script>
let C=document.getElementById('c'),X=C.getContext('2d');
function R(){C.width=innerWidth;C.height=innerHeight}R();
addEventListener('resize',R);
let t=0, sx2=80, step=0, catX=0, catDir=1;
let tapOpen=true, waterParticles=[], storyState=0, closeProgress=0, tapX=0, tapY=0;
let birds=[], flyingBird=null, birdLanded=false;
let mediaRecorder, recordedChunks=[], isRecording=false, showCanvasMsg=false, recordTimer=null, recSeconds=0;

function resetStory(){
  tapOpen=true; storyState=0; closeProgress=0; sx2=80; catX=C.width-320; birdLanded=false; showCanvasMsg=false;
  waterParticles=[]; birds=[]; 
  for(let i=0;i<4;i++){ birds.push({x:Math.random()*C.width, y:35+Math.random()*55, vx:0.7+Math.random()*1, wing:Math.random()*10}); }
  flyingBird={x:-30, y:55, tx:C.width-145, ty:0, vx:2.8, wing:0, flying:true};
}
resetStory();

function startTimer(){
  recSeconds=0; document.getElementById('timer').style.display='block';
  recordTimer=setInterval(()=>{ recSeconds++; document.getElementById('time').textContent=recSeconds+'s'; },1000);
}
function stopTimer(){
  clearInterval(recordTimer); document.getElementById('timer').style.display='none';
}

function toggleRecording(){
  let btn=document.getElementById('recBtn');
  if(!isRecording){
    recordedChunks=[]; 
    let stream=C.captureStream(30);
    mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      let blob=new Blob(recordedChunks,{type:'video/webm'});
      let url=URL.createObjectURL(blob);
      let a=document.createElement('a'); a.href=url; a.download='Pani-Bachao-Final.webm'; a.click();
      URL.revokeObjectURL(url);
      btn.textContent='🔴 Normal Record'; btn.classList.remove('recording'); isRecording=false; stopTimer();
    };
    mediaRecorder.start(); isRecording=true; btn.textContent='⏹️ Stop & Download'; btn.classList.add('recording'); startTimer();
  } else { mediaRecorder.stop(); }
}

function autoRecord(){
  resetStory();
  setTimeout(()=>{
    recordedChunks=[]; 
    let stream=C.captureStream(30);
    mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      let blob=new Blob(recordedChunks,{type:'video/webm'});
      let url=URL.createObjectURL(blob);
      let a=document.createElement('a'); a.href=url; a.download='Pani-Bachao-Full-Story-15s.webm'; a.click();
      URL.revokeObjectURL(url);
      document.getElementById('autoBtn').textContent='🎬 Auto Full Story Record (15s)'; isRecording=false; stopTimer();
      alert('✅ Video download ho gayi! Ab isme middle wala msg bhi hoga!');
    };
    mediaRecorder.start(); isRecording=true; startTimer();
    document.getElementById('autoBtn').textContent='⏺️ Recording... 15s tak';
    // Auto stop after 15 seconds - puri story ke saath
    setTimeout(()=>{ if(isRecording) mediaRecorder.stop(); },15000);
  },500);
}

function drawCanvasMessage(){
  let msgW=360, msgH=150;
  let mx=C.width/2 - msgW/2, my=C.height*0.32 - msgH/2;
  X.fillStyle='white'; X.shadowColor='rgba(0,0,0,0.5)'; X.shadowBlur=18;
  X.beginPath(); X.roundRect(mx,my,msgW,msgH,15); X.fill(); X.shadowBlur=0;
  let colors=['#FF0000','#FFFF00','#00FF00','#00FFFF','#FF00FF','#FF9800'];
  for(let i=0;i<28;i++){
    let p=(i/28 + t*0.025)%1; let x,y;
    if(p<0.25){ x=mx + p/0.25*msgW; y=my; }
    else if(p<0.5){ x=mx+msgW; y=my + (p-0.25)/0.25*msgH; }
    else if(p<0.75){ x=mx+msgW - (p-0.5)/0.25*msgW; y=my+msgH; }
    else { x=mx; y=my+msgH - (p-0.75)/0.25*msgH; }
    X.fillStyle=colors[(Math.floor(t*2)+i)%colors.length];
    X.shadowColor=X.fillStyle; X.shadowBlur=8;
    X.beginPath(); X.arc(x,y,6,0,6.28); X.fill(); X.shadowBlur=0;
  }
  let colorCycle=['#FF0000','#2196F3','#4CAF50','#FF9800'];
  X.textAlign='center';
  X.font='bold 22px Arial'; X.fillStyle=colorCycle[Math.floor(t*1.2)%4];
  X.fillText('💧 PANI BACHAO! 💧', C.width/2, my+40);
  X.font='bold 15px Arial';
  X.fillStyle=colorCycle[(Math.floor(t)+1)%4]; X.fillText('🚫 Pani Waste Na Karain', C.width/2, my+70);
  X.fillStyle=colorCycle[(Math.floor(t)+2)%4]; X.fillText('💙 Pani Zindagi Hai 💙', C.width/2, my+95);
  X.fillStyle='#4CAF50'; X.font='bold 12px Arial'; X.fillText('✅ Nal Band Ho Gaya!', C.width/2, my+120);
}

function draw(){
t+=0.14; step+=0.2; catX+=catDir*0.8;
let hx=C.width-260, hy=C.height-260;
let houseLeft=hx, houseRight=hx+220;
if(catX>houseRight-30) catDir=-1;
if(catX<houseLeft-20) catDir=1;
X.clearRect(0,0,C.width,C.height);
X.fillStyle='#87CEEB';X.fillRect(0,0,C.width,C.height);
X.fillStyle='#7AC87A';X.fillRect(0,C.height-80,C.width,80);
X.fillStyle='#5D4037';X.fillRect(hx-5,C.height-80,230,10);
tapX=C.width*0.52; tapY=C.height-200;
for(let b of birds){
  b.x+=b.vx; b.wing+=0.35;
  if(b.x>C.width+30) b.x=-30;
  X.strokeStyle='black';X.lineWidth=1.8;X.lineCap='round';
  let wy=Math.sin(b.wing)*6;
  X.beginPath();X.moveTo(b.x-10,b.y+wy);X.lineTo(b.x,b.y);X.lineTo(b.x+10,b.y+wy);X.stroke();
}
if(flyingBird && flyingBird.flying){
  flyingBird.wing+=0.45;
  let targetY=hy-75; flyingBird.tx=hx+160;
  let dx=flyingBird.tx-flyingBird.x, dy=targetY-flyingBird.y;
  let dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<10){ flyingBird.flying=false; birdLanded=true; }
  else { flyingBird.x+=dx*0.025; flyingBird.y+=dy*0.025; }
  X.strokeStyle='black';X.lineWidth=2;
  let wy=Math.sin(flyingBird.wing)*8;
  X.beginPath();X.moveTo(flyingBird.x-12,flyingBird.y+wy);X.lineTo(flyingBird.x,flyingBird.y);X.lineTo(flyingBird.x+12,flyingBird.y+wy);X.stroke();
  X.fillStyle='#6D4C41';X.beginPath();X.arc(flyingBird.x,flyingBird.y,5,0,6.28);X.fill();
}
let sunX=C.width-110, sunY=80;
X.save();X.translate(sunX,sunY);X.rotate(t*0.02);
X.strokeStyle='#FFD700';X.lineWidth=4;
for(let i=0;i<12;i++){X.rotate(Math.PI/6);X.beginPath();X.moveTo(48,0);X.lineTo(68,0);X.stroke();}
X.restore();
X.fillStyle='#FFD700';X.beginPath();X.arc(sunX,sunY,40,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(sunX-12,sunY-7,3.5,0,6.28);X.arc(sunX+12,sunY-7,3.5,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.arc(sunX,sunY+8,10,0.2,Math.PI-0.2);X.stroke();
let boardX=15, boardY=35;
X.fillStyle='#2196F3';X.fillRect(boardX,boardY,190,60);
X.strokeStyle='#0D47A1';X.lineWidth=3;X.strokeRect(boardX,boardY,190,60);
X.fillStyle='white';X.font='bold 13px Arial';X.fillText('💧 PANI BACHAO 💧',boardX+18,boardY+20);
X.font='bold 11px Arial';X.fillText(tapOpen?'⚠️ Nal Khula Hai!':'✅ Nal Band!',boardX+28,boardY+38);
X.fillText('Pani Zindagi Hai',boardX+32,boardY+53);
X.fillStyle='#FFE4B5';X.fillRect(hx,hy,220,180);
X.fillStyle='#E74C3C';X.beginPath();X.moveTo(hx-20,hy);X.lineTo(hx+110,hy-70);X.lineTo(hx+240,hy);X.closePath();X.fill();
X.fillStyle='#8B4513';X.fillRect(hx+85,hy+90,45,90);
X.fillStyle='gold';X.beginPath();X.arc(hx+118,hy+130,6,0,6.28);X.fill();
X.fillStyle='#87CEEB';X.strokeStyle='#8B4513';X.lineWidth=3;
X.fillRect(hx+15,hy+20,50,50);X.strokeRect(hx+15,hy+20,50,50);
X.fillRect(hx+155,hy+20,50,50);X.strokeRect(hx+155,hy+20,50,50);
X.fillStyle='#444';X.fillRect(hx+145,hy-70,30,75);
X.fillStyle='#333';X.fillRect(hx+140,hy-75,40,14);
X.fillStyle='#DDD';
if(tapOpen && !birdLanded){ X.beginPath();X.arc(hx+160,hy-80,16,0,6.28);X.fill(); }
if(birdLanded){
  let bx1=hx+160, by1=hy-82;
  X.fillStyle='#6D4C41';X.beginPath();X.ellipse(bx1,by1,12,7,0,0,6.28);X.fill();
  X.beginPath();X.arc(bx1+8,by1-4,7,0,6.28);X.fill();
  X.fillStyle='#FFA000';X.beginPath();X.moveTo(bx1+15,by1-4);X.lineTo(bx1+20,by1-2);X.lineTo(bx1+15,by1);X.fill();
  X.fillStyle='black';X.beginPath();X.arc(bx1+10,by1-6,1.5,0,6.28);X.fill();
}
X.fillStyle='#999';X.fillRect(tapX-50,tapY,90,16);
X.fillStyle='#777';X.fillRect(tapX+30,tapY-12,16,60);
X.fillStyle=tapOpen?'#E74C3C':'#2ECC71';
X.beginPath();X.arc(tapX+38,tapY+42,16,0,6.28);X.fill();
X.fillStyle='white';X.font='bold 10px Arial';X.fillText(tapOpen?'OPEN':'CLOSE',tapX+18,tapY+46);
if(tapOpen && Math.random()>0.25){
  waterParticles.push({x:tapX+38+Math.random()*6-3, y:tapY+55, vy:Math.random()*4+3, vx:Math.random()*0.8-0.4, life:1});
}
for(let i=waterParticles.length-1;i>=0;i--){
  let p=waterParticles[i];
  if(tapOpen || p.y < C.height-80){
    p.y+=p.vy; p.x+=p.vx||0; p.vy+=0.18; p.life-=0.01;
    X.fillStyle=`rgba(33,150,243,${p.life})`;
    X.beginPath();X.arc(p.x,p.y,6,0,6.28);X.fill();
    if(p.y>C.height-80 || p.life<=0) waterParticles.splice(i,1);
  }
}
if(!tapOpen && waterParticles.length>0 && t%3==0) waterParticles.pop();
let bx=30, by=C.height-150;
X.fillStyle='#5D4037';X.fillRect(bx+15,by+15,12,45);X.fillRect(bx+105,by+15,12,45);
X.fillStyle='#8B4513';X.fillRect(bx,by,130,14);
X.fillRect(bx,by-30,130,12);
X.fillRect(bx+15,by-30,10,44);X.fillRect(bx+105,by-30,10,44);
let wx=bx+65, wy=by;
X.strokeStyle='black';X.lineWidth=3;X.lineCap='round';
X.beginPath();X.arc(wx,wy-38,14,0,6.28);X.stroke();
X.beginPath();X.arc(wx-2,wy-44,14,Math.PI*0.9,Math.PI*1.9);X.stroke();
X.beginPath();X.moveTo(wx,wy-24);X.lineTo(wx,wy-5);X.stroke();
X.beginPath();X.moveTo(wx-12,wy-5);X.lineTo(wx+12,wy-5);X.lineTo(wx+10,wy+8);X.lineTo(wx-10,wy+8);X.closePath();X.stroke();
X.beginPath();X.moveTo(wx-6,wy+8);X.lineTo(wx-6,wy+28);X.lineTo(wx-10,wy+28);X.stroke();
X.beginPath();X.moveTo(wx+6,wy+8);X.lineTo(wx+6,wy+28);X.lineTo(wx+10,wy+28);X.stroke();
X.beginPath();X.moveTo(wx,wy-16);X.lineTo(wx-14,wy-2);X.moveTo(wx,wy-16);X.lineTo(wx+14,wy-2);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(wx-4,wy-41,1.8,0,6.28);X.arc(wx+4,wy-41,1.8,0,6.28);X.fill();
let m1=Math.abs(Math.sin(t*0.4+1))*4+1;
X.fillStyle='#FF3366';X.beginPath();X.ellipse(wx,wy-31,4,m1,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1;X.stroke();
let cy=C.height-88;
let catWalk=Math.sin(step*1.5)*6;
let tailWag=Math.sin(t)*1.3;
X.fillStyle='#FFA500';
X.beginPath();X.ellipse(catX,cy-5,18,10,0,0,6.28);X.fill();
X.fillStyle='#FF8C00';
X.beginPath();X.ellipse(catX-8+catWalk*0.3,cy+2,4,6,0,0,6.28);X.fill();
X.beginPath();X.ellipse(catX+8-catWalk*0.3,cy+2,4,6,0,0,6.28);X.fill();
X.fillStyle='#FFA500';X.beginPath();X.arc(catX+18*catDir,cy-12,12,0,6.28);X.fill();
X.beginPath();X.moveTo(catX+12*catDir,cy-20);X.lineTo(catX+10*catDir,cy-30);X.lineTo(catX+18*catDir,cy-22);X.fill();
X.beginPath();X.moveTo(catX+22*catDir,cy-20);X.lineTo(catX+24*catDir,cy-30);X.lineTo(catX+28*catDir,cy-22);X.fill();
X.fillStyle='pink';X.beginPath();X.arc(catX+13*catDir,cy-23,2.5,0,6.28);X.arc(catX+23*catDir,cy-23,2.5,0,6.28);X.fill();
X.fillStyle='green';X.beginPath();X.arc(catX+22*catDir,cy-14,3,0,6.28);X.arc(catX+28*catDir,cy-14,3,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(catX+22*catDir,cy-14,1,0,6.28);X.arc(catX+28*catDir,cy-14,1,0,6.28);X.fill();
X.strokeStyle='#FF8C00';X.lineWidth=6;X.lineCap='round';
X.beginPath();X.moveTo(catX-18,cy-5);
X.quadraticCurveTo(catX-28+tailWag*8,cy-12,catX-32,cy-2);X.stroke();
let sy2=C.height-80;
if(storyState==0){
  if(sx2 < tapX-55){ sx2+=1.8; }
  else { storyState=1; closeProgress=0; }
}
if(storyState==1){
  closeProgress+=0.04;
  if(closeProgress>=1){ 
    tapOpen=false; 
    showCanvasMsg=true; // FORAN dikhega, wait nahi
    storyState=2; 
  }
}
let leg1=Math.sin(step)*16, leg2=Math.sin(step+Math.PI)*16;
let arm1=Math.sin(step)*12, arm2=Math.sin(step+Math.PI)*12;
let reachingArm = storyState==1 ? 15+closeProgress*30 : 0;
X.strokeStyle='black';X.lineWidth=3.2;
X.beginPath();X.arc(sx2,sy2-85,18,0,6.28);X.stroke();
X.beginPath();X.moveTo(sx2,sy2-67);X.lineTo(sx2,sy2-30);X.stroke();
if(storyState==1){
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2+reachingArm,sy2-40);X.stroke();
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2-15,sy2-40);X.stroke();
} else {
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2-18+arm1*0.2,sy2-42);X.moveTo(sx2,sy2-55);X.lineTo(sx2+18+arm2*0.2,sy2-42);X.stroke();
}
X.beginPath();X.moveTo(sx2,sy2-30);X.lineTo(sx2-8+leg1*0.6,sy2);X.moveTo(sx2,sy2-30);X.lineTo(sx2+8+leg2*0.6,sy2);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(sx2-6,sy2-90,2,0,6.28);X.arc(sx2+6,sy2-90,2,0,6.28);X.fill();
let m2=storyState==1?2:Math.abs(Math.sin(t*0.6))*6+1;
X.fillStyle='#FF4444';X.beginPath();X.ellipse(sx2,sy2-78,6,m2,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1;X.stroke();
if(showCanvasMsg){
  drawCanvasMessage();
}
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
