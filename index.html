<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billi Wala Garden</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#87CEEB}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
function resize(){cv.width=innerWidth; cv.height=innerHeight;} addEventListener('resize',resize); resize();
let t=0, falling=[];
for(let i=0;i<25;i++) falling.push({x:Math.random()*400, y:Math.random()*400, vx:(Math.random()-0.5)*0.7, vy:Math.random()*1+0.4, r:Math.random()*4+3});
let flowers=[]; for(let i=0;i<70;i++) flowers.push({x:0, y:0, type:Math.floor(Math.random()*3)})

function draw(){
 t+=0.03; let W=cv.width, H=cv.height;
 x.fillStyle="#87CEEB"; x.fillRect(0,0,W,H*0.6);
 x.fillStyle="#7CFC00"; x.fillRect(0,H*0.6,W,H*0.4);

 // SUN with eyes
 let sunX=W-110,sunY=110;
 x.strokeStyle="rgba(255,215,0,0.8)"; x.lineWidth=4;
 for(let i=0;i<12;i++){let a=(i/12)*Math.PI*2+t; x.beginPath(); x.moveTo(sunX+Math.cos(a)*42,sunY+Math.sin(a)*42); x.lineTo(sunX+Math.cos(a)*68,sunY+Math.sin(a)*68); x.stroke();}
 x.fillStyle="#FFD700"; x.beginPath(); x.arc(sunX,sunY,42,0,7); x.fill();
 x.fillStyle="white"; x.beginPath(); x.arc(sunX-11,sunY-7,8,0,7); x.arc(sunX+11,sunY-7,8,0,7); x.fill();
 x.fillStyle="black"; x.beginPath(); x.arc(sunX-11+Math.sin(t*2)*2,sunY-6,3,0,7); x.arc(sunX+11+Math.sin(t*2)*2,sunY-6,3,0,7); x.fill();
 x.strokeStyle="black"; x.lineWidth=2.5; x.beginPath(); x.arc(sunX,sunY+11,13,0.2,Math.PI-0.2); x.stroke();

 // House
 let hx=W/2-100, hy=H*0.6-160;
 x.fillStyle="#FFE4B5"; x.fillRect(hx,hy,200,160); x.strokeStyle="#8B4513"; x.lineWidth=3; x.strokeRect(hx,hy,200,160);
 x.fillStyle="#B22222"; x.beginPath(); x.moveTo(hx-10,hy); x.lineTo(hx+100,hy-70); x.lineTo(hx+210,hy); x.closePath(); x.fill(); x.stroke();
 x.fillStyle="#8B4513"; x.fillRect(hx+70,hy+90,50,70);

 // Flowers
 flowers.forEach(f=>{
   if(f.x==0){f.x=Math.random()*W; f.y=H*0.6+20+Math.random()*(H*0.4-30);}
   x.strokeStyle="#2E7D32"; x.lineWidth=2; x.beginPath(); x.moveTo(f.x,f.y); x.lineTo(f.x,f.y+12); x.stroke();
   x.fillStyle=f.type==0?"#FF69B4":f.type==1?"#FF0000":"#FFD700"; x.beginPath(); x.arc(f.x,f.y,6,0,7); x.fill();
   x.fillStyle="yellow"; x.beginPath(); x.arc(f.x,f.y,2,0,7); x.fill();
 });

 // DARAKHT 1 - OONCHA with visible LEAVES
 let s1=Math.sin(t)*4, tx1=50+s1, ty1=H*0.6;
 x.fillStyle="#5D4037"; x.fillRect(tx1,ty1-190,22,190);
 // Big leaves groups
 x.fillStyle="#1B5E20"; x.beginPath(); x.arc(tx1+11,ty1-200,58,0,7); x.fill();
 x.fillStyle="#2E7D32"; x.beginPath(); x.arc(tx1-10,ty1-220,38,0,7); x.fill();
 x.fillStyle="#388E3C"; x.beginPath(); x.arc(tx1+30,ty1-210,32,0,7); x.fill();
 x.fillStyle="#4CAF50"; x.beginPath(); x.arc(tx1+11,ty1-240,20,0,7); x.fill();
 // Chote chote patte dikhne chahye - leaf details 🍃
 x.fillStyle="#81C784";
 for(let i=0;i<12;i++){let a=(i/12)*Math.PI*2+t; x.beginPath(); x.arc(tx1+11+Math.cos(a)*35, ty1-200+Math.sin(a)*35, 8,0,7); x.fill();}
 x.fillStyle="#A5D6A7";
 for(let i=0;i<8;i++){let a=(i/8)*Math.PI*2+t*1.5; x.beginPath(); x.arc(tx1+11+Math.cos(a)*22, ty1-200+Math.sin(a)*22, 5,0,7); x.fill();}

 // DARAKHT 2
 let s2=Math.cos(t*1.1)*3, tx2=W-130+s2;
 x.fillStyle="#5D4037"; x.fillRect(tx2,ty1-170,20,170);
 x.fillStyle="#1B5E20"; x.beginPath(); x.arc(tx2+10,ty1-180,52,0,7); x.fill();
 x.fillStyle="#2E7D32"; x.beginPath(); x.arc(tx2+25,ty1-195,30,0,7); x.fill();
 x.fillStyle="#66BB6A"; x.beginPath(); x.arc(tx2-5,ty1-185,26,0,7); x.fill();
 x.fillStyle="#81C784";
 for(let i=0;i<10;i++){let a=(i/10)*Math.PI*2+t; x.beginPath(); x.arc(tx2+10+Math.cos(a)*30, ty1-180+Math.sin(a)*30, 7,0,7); x.fill();}

 // BILLI IN GARDEN 🐱 - Behti hui
 let catX=hx-60, catY=ty1-15;
 // Dum hil rahi hai
 let tailWag=Math.sin(t*3)*10;
 // Body
 x.fillStyle="#FFA726"; x.beginPath(); x.ellipse(catX,catY,28,18,0,0,7); x.fill();
 x.fillStyle="#FB8C00"; x.beginPath(); x.ellipse(catX-5,catY+5,20,12,0,0,7); x.fill();
 // Head
 x.fillStyle="#FFA726"; x.beginPath(); x.arc(catX+22,catY-12,18,0,7); x.fill();
 // Ears
 x.fillStyle="#FFA726"; x.beginPath(); x.moveTo(catX+12,catY-25); x.lineTo(catX+16,catY-35); x.lineTo(catX+22,catY-24); x.fill();
 x.beginPath(); x.moveTo(catX+28,catY-26); x.lineTo(catX+32,catY-36); x.lineTo(catX+36,catY-24); x.fill();
 x.fillStyle="pink"; x.beginPath(); x.moveTo(catX+15,catY-27); x.lineTo(catX+17,catY-31); x.lineTo(catX+20,catY-26); x.fill();
 x.beginPath(); x.moveTo(catX+30,catY-28); x.lineTo(catX+32,catY-32); x.lineTo(catX+34,catY-26); x.fill();
 // Eyes 👀 - band hoti khulti
 let eyeClose=Math.sin(t*2)>0.9?1:0;
 if(eyeClose==0){
   x.fillStyle="white"; x.beginPath(); x.arc(catX+18,catY-14,5,0,7); x.arc(catX+28,catY-14,5,0,7); x.fill();
   x.fillStyle="#2E7D32"; x.beginPath(); x.arc(catX+18,catY-14,2.5,0,7); x.arc(catX+28,catY-14,2.5,0,7); x.fill();
   x.fillStyle="black"; x.beginPath(); x.arc(catX+18,catY-14,1,0,7); x.arc(catX+28,catY-14,1,0,7); x.fill();
 } else { x.strokeStyle="black"; x.lineWidth=2; x.beginPath(); x.moveTo(catX+14,catY-14); x.lineTo(catX+22,catY-14); x.moveTo(catX+24,catY-14); x.lineTo(catX+32,catY-14); x.stroke();}
 // Nose & Mouth
 x.fillStyle="pink"; x.beginPath(); x.arc(catX+24,catY-9,2,0,7); x.fill();
 x.strokeStyle="black"; x.lineWidth=1; x.beginPath(); x.moveTo(catX+24,catY-8); x.lineTo(catX+22,catY-5); x.moveTo(catX+24,catY-8); x.lineTo(catX+26,catY-5); x.stroke();
 // Tail - hil rahi
 x.strokeStyle="#FFA726"; x.lineWidth=10; x.lineCap="round"; x.beginPath(); x.moveTo(catX-28,catY); x.quadraticCurveTo(catX-50+tailWag,catY-15, catX-45,catY-30); x.stroke();
 // Paws
 x.fillStyle="#FFE0B2"; x.beginPath(); x.ellipse(catX+5,catY+14,8,5,0,0,7); x.ellipse(catX+20,catY+14,8,5,0,0,7); x.fill();

 // Falling leaves
 falling.forEach(l=>{l.y+=l.vy; l.x+=l.vx+Math.sin(t+l.x)*0.5; if(l.y>H){l.y=H*0.3; l.x=Math.random()*W;} x.fillStyle="rgba(76,175,80,0.8)"; x.beginPath(); x.ellipse(l.x,l.y,l.r,l.r*0.6,Math.sin(t+l.x),0,7); x.fill();});

 requestAnimationFrame(draw);
}
draw();
</script></body></html>
