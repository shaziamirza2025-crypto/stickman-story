<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glittery Gaon</title>
<style>*{margin:0;padding:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
h1{position:fixed;top:12px;width:100%;text-align:center;color:white;font-family:cursive;text-shadow:0 0 12px gold,0 0 20px deeppink;font-size:28px;z-index:5}</style></head>
<body><h1>✨ Mera Piyara Gaon ✨</h1><canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
function R(){C.width=innerWidth;C.height=innerHeight}R();addEventListener('resize',R);
let t=0,birds=[];for(let i=0;i<7;i++)birds.push({x:Math.random()*innerWidth,y:20+Math.random()*120,v:1+Math.random()*1.2});
function drawFace(x,y,s){
 X.fillStyle='#FFDB99';X.beginPath();X.arc(x,y,s,0,6.28);X.fill();
 X.fillStyle='white';X.beginPath();X.arc(x-4,y-2,3,0,6.28);X.arc(x+4,y-2,3,0,6.28);X.fill();
 X.fillStyle='black';X.beginPath();X.arc(x-4,y-1,1.5,0,6.28);X.arc(x+4,y-1,1.5,0,6.28);X.fill();
 X.fillStyle='black';X.beginPath();X.arc(x,y+3,3,0.1,3);X.stroke();
 X.fillStyle='rgba(255,0,0,0.3)';X.beginPath();X.arc(x-7,y+1,2,0,6.28);X.arc(x+7,y+1,2,0,6.28);X.fill();
}
function loop(){
 let g=X.createLinearGradient(0,0,0,C.height*0.6);g.addColorStop(0,'#87CEEB');g.addColorStop(1,'#C3FFC3');X.fillStyle=g;X.fillRect(0,0,C.width,C.height);
 // Suraj stylish
 let sx=C.width-110,sy=95;X.save();X.translate(sx,sy);X.rotate(t/90);
 X.fillStyle='#FFD700';X.shadowColor='gold';X.shadowBlur=20;for(let i=0;i<12;i++){X.rotate(0.523);X.fillRect(-2.5,-55,5,30)}X.shadowBlur=0;
 X.fillStyle='#FFC300';X.beginPath();X.arc(0,0,38,0,6.28);X.fill();X.restore();
 X.fillStyle='white';X.beginPath();X.arc(sx-9,sy-6,7,0,6.28);X.arc(sx+9,sy-6,7,0,6.28);X.fill();
 X.fillStyle='black';X.beginPath();X.arc(sx-9,sy-4,3,0,6.28);X.arc(sx+9,sy-4,3,0,6.28);X.fill();
 X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.arc(sx,sy+8,10,0.2,3.0);X.stroke();
 X.fillStyle='pink';X.beginPath();X.arc(sx-17,sy+2,4,0,6.28);X.arc(sx+17,sy+2,4,0,6.28);X.fill();
 // Birds SAFF dikhenge
 birds.forEach(b=>{b.x+=b.v;if(b.x>C.width+30)b.x=-30;X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.moveTo(b.x,b.y);X.quadraticCurveTo(b.x+5,b.y-6,b.x+10,b.y);X.quadraticCurveTo(b.x+15,b.y-6,b.x+20,b.y);X.stroke();X.fillStyle='black';X.beginPath();X.arc(b.x+10,b.y,2,0,6.28);X.fill()});
 // Zameen
 X.fillStyle='#7AC87A';X.fillRect(0,C.height*0.58,C.width,C.height*0.42);
 // Ghar
 X.fillStyle='#FFD9A0';X.fillRect(C.width-210,C.height*0.46,130,95);X.fillStyle='#E74C3C';X.beginPath();X.moveTo(C.width-220,C.height*0.46);X.lineTo(C.width-145,C.height*0.40);X.lineTo(C.width-70,C.height*0.46);X.fill();X.fillStyle='#5D2906';X.fillRect(C.width-160,C.height*0.46+50,22,45);
 X.fillStyle='white';X.beginPath();X.arc(C.width-145,C.height*0.46+25,8,0,6.28);X.fill();
 // Bench aur AURAT face ke sath
 X.fillStyle='#5D4037';X.fillRect(40,C.height*0.57,120,10);X.fillRect(55,C.height*0.57+10,10,35);X.fillRect(135,C.height*0.57+10,10,35);
 X.fillStyle='#FF1493';X.beginPath();X.ellipse(100,C.height*0.55,20,24,0,0,6.28);X.fill();
 drawFace(100,C.height*0.55-24,16);
 X.fillStyle='black';X.beginPath();X.arc(100,C.height*0.55-38,18,3.14,6.28);X.fill(); // baal
 // KUEN with pani visible
 let kx=C.width*0.52,ky=C.height*0.60;
 X.fillStyle='#777';X.fillRect(kx-42,ky,84,52);X.strokeStyle='#C0392B';X.lineWidth=2;X.strokeRect(kx-42,ky,84,52);
 X.fillStyle='#A9A9A9';X.fillRect(kx-5,ky-90,10,90);X.fillRect(kx-28,ky-90,36,10);
 X.strokeStyle='#8B4513';X.lineWidth=3;X.beginPath();X.moveTo(kx+23,ky-80);X.lineTo(kx+23,ky+10+Math.sin(t/10)*3);X.stroke();
 X.fillStyle='#666';X.fillRect(kx+10,ky+10+Math.sin(t/10)*3,26,10);
 X.fillStyle='#00BFFF';X.fillRect(kx+20,ky+20+Math.sin(t/10)*3,6,38);
 for(let i=0;i<6;i++){X.fillStyle='rgba(0,180,255,'+(0.8-i*0.1)+')';X.beginPath();X.arc(kx+23+Math.random()*4,ky+22+Math.sin(t/10)*3+i*7,3,0,6.28);X.fill()}
 X.fillStyle='rgba(0,150,255,0.35)';X.beginPath();X.ellipse(kx+23,ky+52,20,7,0,0,6.28);X.fill();
 // Bail aur Kisan face ke sath
 let bx=(t*0.8)%(C.width+320)-160,by=C.height*0.73;
 function drawBail(x){X.fillStyle='#8B4513';X.fillRect(x,by,58,24);X.fillStyle='#000';X.beginPath();X.arc(x+50,by-4,6,0,6.28);X.fill();X.fillStyle='white';X.beginPath();X.arc(x+52,by-5,2,0,6.28);X.fill();X.fillStyle='#FFD700';X.beginPath();X.moveTo(x+45,by-12);X.lineTo(x+42,by-18);X.lineTo(x+48,by-12);X.fill();X.beginPath();X.moveTo(x+55,by-12);X.lineTo(x+58,by-18);X.lineTo(x+52,by-12);X.fill()}
 drawBail(bx);drawBail(bx+68);
 X.fillStyle='#FFD700';X.fillRect(bx+58,by+8,70,4);
 X.fillStyle='#FF4500';X.fillRect(bx+130,by-18,22,26);drawFace(bx+141,by-22,10);
 // glitter
 for(let i=0;i<22;i++){if(Math.random()>0.5){X.fillStyle='rgba(255,255,255,'+Math.random()+')';X.shadowColor='gold';X.shadowBlur=10;X.beginPath();X.arc(Math.random()*C.width,Math.random()*C.height*0.85,Math.random()*2.5+0.5,0,6.28);X.fill();X.shadowBlur=0}}
 t++;requestAnimationFrame(loop);
}loop();
</script></body></html>
