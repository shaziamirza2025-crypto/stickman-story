<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;overflow:hidden;background:#000}
.bg{position:fixed;inset:0;background:url(background.jpg) center/cover}
h1{position:fixed;top:12px;width:100%;text-align:center;color:white;font-family:cursive;font-size:30px;text-shadow:0 0 15px gold}
#g{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="g"></canvas>
<h1>✨ Mera Chamkeela Gaon ✨</h1>
<script>
let C=document.getElementById('g'),X=C.getContext('2d');function R(){C.width=innerWidth;C.height=innerHeight}R();
addEventListener('resize',R);
let P=[];for(let i=0;i<100;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+0.5});
(function L(){X.clearRect(0,0,C.width,C.height);P.forEach(p=>{p.y-=0.5;if(p.y<0)p.y=C.height;X.fillStyle='white';X.shadowColor='gold';X.shadowBlur=10;X.beginPath();X.arc(p.x,p.y,p.r,0,6.28);X.fill();X.shadowBlur=0});requestAnimationFrame(L)})();
</script>
</body>
</html>
