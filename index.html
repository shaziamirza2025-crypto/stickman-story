<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funny Faqeer 2</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:4px solid gold;border-radius:20px}</style></head><body><canvas id="c" width="360" height="640"></canvas><script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let p=30,f=360,s=0,st=0,t=0,money=[];
function draw(){
x.fillStyle="#FFD700";x.fillRect(0,0,360,640);x.fillStyle="#87CEEB";x.fillRect(0,0,360,380);x.fillStyle="#90EE90";x.fillRect(0,400,360,240);
x.fillStyle="#8B4513";x.fillRect(180,220,150,180);x.fillStyle="white";x.font="bold 14px sans-serif";x.fillText("SETH KANJOOS",195,240);x.fillText("🏦 BANK",220,380);
// Seth fat
x.fillStyle="#FFA500";x.beginPath();x.arc(255,320,30,0,7);x.fill();x.fillStyle="black";x.fillRect(255-20,350,40,50);x.font="10px sans-serif";x.fillText("SETH",240,430);
// Faqeer
if(st==0){p+=2.5;s+=0.4;if(p>140){st=1;t=0}} if(st==1){t++;if(t>80){st=2;t=0;for(let i=0;i<20;i++)money.push({x:255,y:300,vx:(Math.random()-0.5)*10,vy:-Math.random()*12})}} 
money.forEach(m=>{m.x+=m.vx;m.y+=m.vy;m.vy+=0.3;x.fillStyle="green";x.font="bold 14px sans-serif";x.fillText("💵",m.x,m.y)});
x.strokeStyle="black";x.lineWidth=3;x.beginPath();x.arc(p,f-30,18,0,7);x.stroke();x.beginPath();x.moveTo(p,f-12);x.lineTo(p,f+30);x.stroke();let l=Math.sin(s)*18;if(st<2){x.beginPath();x.moveTo(p,f+30);x.lineTo(p-12+l,f+70);x.moveTo(p,f+30);x.lineTo(p+12-l,f+70);x.stroke()}else{x.beginPath();x.moveTo(p,f+30);x.lineTo(p-15,f+60);x.moveTo(p,f+30);x.lineTo(p+15,f+60);x.stroke();x.fillStyle="black";x.font="bold 16px sans-serif";if(t<50)x.fillText("Oye Seth! Lottery Lag Gayi!",20,150);else{x.fillText("Seth Behossh! Faqeer Ameer! 😂",20,150);x.fillText("💰💰💰",p-20,f-60)}}
x.fillStyle="black";x.font="bold 18px sans-serif";if(st==0)x.fillText("Faqeera ja raha hai...",20,500);if(st==1)x.fillText("Faqeer: Seth, Dua Du Ga!",20,500);
requestAnimationFrame(draw);}draw();cv.onclick=()=>{p=30;f=360;st=0;t=0;money=[]};
</script></body></html>
