<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seth House + Garden</title><style>body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:4px solid white;border-radius:15px}</style></head><body><canvas id="c" width="360" height="640"></canvas><script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
let p=20, f=400, s=0, st=0, t=0;
let flowers=[];
for(let i=0;i<25;i++){flowers.push({x:20+Math.random()*120, y:420+Math.random()*180, type:Math.floor(Math.random()*3), scale:Math.random()*0.5+0.8})}

function drawHouse(){
 x.fillStyle="#87CEEB"; x.fillRect(0,0,360,360);
 x.fillStyle="#90EE90"; x.fillRect(0,360,360,280);
 x.fillStyle="yellow"; x.beginPath(); x.arc(300,70,25,0,7); x.fill();
 // House
 x.fillStyle="#FFE4B5"; x.fillRect(150,200,190,160); x.strokeStyle="#8B4513"; x.lineWidth=3; x.strokeRect(150,200,190,160);
 // Roof
 x.fillStyle="#B22222"; x.beginPath(); x.moveTo(140,200); x.lineTo(245,130); x.lineTo(350,200); x.closePath(); x.fill(); x.stroke();
 x.fillStyle="#8B4513"; x.fillRect(285,140,20,50); // chimney
 // Door
 x.fillStyle="#8B4513"; x.fillRect(230,290,45,70); x.fillStyle="gold"; x.beginPath(); x.arc(268,325,4,0,7); x.fill(); x.strokeRect(230,290,45,70);
 // Window 1 - Big
 x.fillStyle="#B0E0E6"; x.fillRect(165,230,55,50); x.strokeRect(165,230,55,50);
 x.fillStyle="white"; x.fillRect(165,230,55,4); x.fillRect(190,230,4,50); x.fillRect(165,252,55,4);
 x.fillStyle="rgba(255,255,200,0.8)"; if(st>0) x.fillRect(168,233,48,45);
 // Window 2
 x.fillStyle="#B0E0E6"; x.fillRect(290,230,40,40); x.strokeRect(290,230,40,40);
 if(st>0){ x.fillStyle="rgba(255,255,200,0.8)"; x.fillRect(293,233,34,34); }
 // Fence
 x.strokeStyle="white"; x.lineWidth=2;
 for(let i=0;i<6;i++){ x.beginPath(); x.moveTo(10+i*20,380); x.lineTo(10+i*20,410); x.stroke(); }
 x.beginPath(); x.moveTo(10,390); x.lineTo(130,390); x.stroke();
 // Garden Flowers
 flowers.forEach(fl=>{
   let fx=fl.x, fy=fl.y;
   // stem
   x.strokeStyle="green"; x.lineWidth=2; x.beginPath(); x.moveTo(fx,fy); x.lineTo(fx,fy+15); x.stroke();
   // flower
   if(fl.type==0){ x.fillStyle="#FF69B4"; x.beginPath(); x.arc(fx,fy,6*fl.scale,0,7); x.fill(); x.fillStyle="yellow"; x.beginPath(); x.arc(fx,fy,2.5,0,7); x.fill(); }
   else if(fl.type==1){ x.fillStyle="red"; x.beginPath(); x.arc(fx,fy,5*fl.scale,0,7); x.fill(); }
   else{ x.fillStyle="#FFD700"; x.beginPath(); x.arc(fx-3,fy,4,0,7); x.arc(fx+3,fy,4,0,7); x.arc(fx,fy-3,4,0,7); x.arc(fx,fy+3,4,0,7); x.fill(); }
 });
 // Trees
 x.fillStyle="#8B4513"; x.fillRect(15,350,10,40); x.fillStyle="green"; x.beginPath(); x.arc(20,340,25,0,7); x.fill();
 x.fillStyle="#8B4513"; x.fillRect(115,360,8,30); x.fillStyle="#228B22"; x.beginPath(); x.arc(119,350,20,0,7); x.fill();
 x.fillStyle="black"; x.font="bold 10px sans-serif"; x.fillText("🌸 GARDEN PARK 🌸",20,425);
}
function draw(){
 drawHouse();
 if(st==0){ p+=1.5; s+=0.3; if(p>100){st=1} }
 x.strokeStyle="black"; x.lineWidth=3; x.beginPath(); x.arc(p,f-30,16,0,7); x.stroke();
 x.beginPath(); x.moveTo(p,f-12); x.lineTo(p,f+30); x.stroke();
 let l=Math.sin(s)*12; x.beginPath(); x.moveTo(p,f+30); x.lineTo(p-8+l,f+65); x.moveTo(p,f+30); x.lineTo(p+8-l,f+65); x.stroke();
 x.fillStyle="black"; x.font="bold 12px sans-serif";
 if(st==0) x.fillText("Wah! Kya Garden hai! 🌸",10,500);
 else x.fillText("Seth ji, Garden me bheek de do! 🙏🌷",10,500);
 requestAnimationFrame(draw);
}
draw();
</script></body></html>
