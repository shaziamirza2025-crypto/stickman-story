<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Faqeer Story Pro</title><style>body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:white;font-family:sans-serif}#stage{width:360px;height:640px;background:linear-gradient(#87CEEB,#fff);border:4px solid white;border-radius:20px;position:relative;overflow:hidden}canvas{width:100%;height:100%}.txt{position:absolute;bottom:100px;width:100%;text-align:center;font-size:22px;font-weight:bold;color:black;background:rgba(255,255,255,.9);padding:10px}.sno{position:absolute;bottom:10px;width:100%;text-align:center;color:black;font-size:14px}button{margin-top:20px;padding:15px 40px;font-size:18px;border-radius:30px;border:none;background:#ff4757;color:white;font-weight:bold}</style></head><body><div id="stage"><canvas id="c" width="360" height="640"></canvas><div class="txt" id="txt">Bheek de do..</div><div class="sno" id="sno">Scene 1: Faqeer bheek mang raha hai</div></div><button onclick="next()">Next Scene -></button><script>let s=0;const sc=[{t:"Bheek de do..",n:"Scene 1: Faqeer bheek mang raha hai",d:()=>{cl();st(180,200)}},{t:"Arey ye to mera dost hai!",n:"Scene 2: Seth ne pehchana",d:()=>{cl();st(120,200,"#000");st(240,200,"#e74c3c")}},{t:"Tu yahan?",n:"Scene 3: Dono hairan",d:()=>{cl();st(120,200,"#000");st(240,200,"#e74c3c");ctx.font="30px serif";ctx.fillText("?!",170,150)}},{t:"Chal chai peete hain!",n:"Scene 4: Dosti wapas",d:()=>{cl();st(120,200,"#000");st(240,200,"#e74c3c");ctx.font="20px serif";ctx.fillText("☕ Chai",150,280)}},{t:"Dosti jeet gayi!",n:"Scene 5: Happy Ending ❤️",d:()=>{cl();st(150,200,"#000");st(210,200,"#e74c3c");ctx.font="30px serif";ctx.fillText("❤️",165,150)}}];const cv=document.getElementById('c'),ctx=cv.getContext('2d');function cl(){ctx.clearRect(0,0,360,640);ctx.fillStyle="#87CEEB";ctx.fillRect(0,0,360,400);ctx.fillStyle="#90EE90";ctx.fillRect(0,400,360,240)}function st(x,y,c="#000"){ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+20);ctx.lineTo(x,y+80);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+30);ctx.lineTo(x-20,y+50);ctx.moveTo(x,y+30);ctx.lineTo(x+20,y+50);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+80);ctx.lineTo(x-15,y+120);ctx.moveTo(x,y+80);ctx.lineTo(x+15,y+120);ctx.stroke()}function next(){s=(s+1)%sc.length;document.getElementById('txt').innerText=sc[s].t;document.getElementById('sno').innerText=sc[s].n;sc[s].d()}sc[0].d();</script></body></html>
