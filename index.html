<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pani Bachao - Living Girl</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:cursive}
canvas{width:100vw;height:100vh;display:block}
h1{position:fixed;top:6px;width:100%;text-align:center;color:#333;z-index:10;font-size:17px}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;background:white;padding:10px 18px;border-radius:25px;box-shadow:0 0 15px rgba(0,0,0,0.3);display:flex;gap:8px}
#controls button{padding:10px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px}
#recBtn{background:#F44336;color:white}
#recBtn.recording{background:#4CAF50;animation:pulse 1s infinite}
#autoBtn{background:#9C27B0;color:white}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
#timer{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:6px 14px;border-radius:15px;display:none;z-index:30;font-size:13px}
</style>
</head>
<body>
<h1>💧 Pani Bachao - Story 💧</h1>
<div id="timer">⏺️ Recording: <span id="time">0s</span></div>
<div id="controls">
<button id="recBtn" onclick="toggleRecording()">🔴 Normal Record</button>
<button id="autoBtn" onclick="autoRecord()">🎬 Auto Full Story (15s)</button>
<button onclick="resetStory()" style="background:#2196F3;color:white">🔄 Restart</button>
</div>
<canvas id="c"></canvas>
<script>
let C=document.getElementById('c'),X=C.getContext('2d');
function R(){C.width=innerWidth;C.height=innerHeight}R();
addEventListener('resize',R);
let t=0, sx2=80, step=0, catX=0, catDir=1;
let tapOpen=true, waterParticles=[], storyState=0, closeProgress=0, tapX=0, tapY=0;
let birds=[], flyingBird=null, birdLanded=false;
let mediaRecorder, recordedChunks=[], isRecording=false, showCanvasMsg=false, recordTimer=null, recSeconds=0;

function resetStory(){
  tapOpen=true; storyState=0; closeProgress=0; sx2=80; catX=C.width-380; birdLanded=false; showCanvasMsg=false;
  waterParticles=[]; birds=[]; 
  for(let i=0;i<4;i++){ birds.push({x:Math.random()*C.width, y:35+Math.random()*55, vx:0.7+Math.random()*1, wing:Math.random()*10}); }
  flyingBird={x:-30, y:55, vx:2.8, wing:0, flying:true};
}
resetStory();
function startTimer(){ recSeconds=0; document.getElementById('timer').style.display='block'; recordTimer=setInterval(()=>{ recSeconds++; document.getElementById('time').textContent=recSeconds+'s'; },1000); }
function stopTimer(){ clearInterval(recordTimer); document.getElementById('timer').style.display='none'; }
function toggleRecording(){
  let btn=document.getElementById('recBtn');
  if(!isRecording){
    recordedChunks=[]; let stream=C.captureStream(30);
    mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{ let blob=new Blob(recordedChunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='Pani-Bachao-Final.webm'; a.click(); URL.revokeObjectURL(url); btn.textContent='🔴 Normal Record'; btn.classList.remove('recording'); isRecording=false; stopTimer(); };
    mediaRecorder.start(); isRecording=true; btn.textContent='⏹️ Stop & Download'; btn.classList.add('recording'); startTimer();
  } else { mediaRecorder.stop(); }
}
function autoRecord(){
  resetStory();
  setTimeout(()=>{
    recordedChunks=[]; let stream=C.captureStream(30);
    mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{ let blob=new Blob(recordedChunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='Pani-Bachao-Full-Story.webm'; a.click(); URL.revokeObjectURL(url); document.getElementById('autoBtn').textContent='🎬 Auto Full Story (15s)'; isRecording=false; stopTimer(); };
    mediaRecorder.start(); isRecording=true; startTimer(); document.getElementById('autoBtn').textContent='⏺️ Recording... 15s';
    setTimeout(()=>{ if(isRecording) mediaRecorder.stop(); },15000);
  },500);
}
function drawCanvasMessage(){
  let msgW=360, msgH=150; let mx=C.width/2 - msgW/2, my=C.height*0.32 - msgH/2;
  X.fillStyle='white'; X.shadowColor='rgba(0,0,0,0.5)'; X.shadowBlur=18;
  X.beginPath(); X.roundRect(mx,my,msgW,msgH,15); X.fill(); X.shadowBlur=0;
  let colors=['#FF0000','#FFFF00','#00FF00','#00FFFF','#FF00FF','#FF9800'];
  for(let i=0;i<28;i++){
    let p=(i/28 + t*0.025)%1; let x,y;
    if(p<0.25){ x=mx + p/0.25*msgW; y=my; } else if(p<0.5){ x=mx+msgW; y=my + (p-0.25)/0.25*msgH; } else if(p<0.75){ x=mx+msgW - (p-0.5)/0.25*msgW; y=my+msgH; } else { x=mx; y=my+msgH - (p-0.75)/0.25*msgH; }
    X.fillStyle=colors[(Math.floor(t*2)+i)%colors.length]; X.shadowColor=X.fillStyle; X.shadowBlur=8;
    X.beginPath(); X.arc(x,y,6,0,6.28); X.fill(); X.shadowBlur=0;
  }
  let colorCycle=['#FF0000','#2196F3','#4CAF50','#FF9800'];
  X.textAlign='center'; X.font='bold 22px Arial'; X.fillStyle=colorCycle[Math.floor(t*1.2)%4];
  X.fillText('💧 PANI BACHAO! 💧', C.width/2, my+40);
  X.font='bold 15px Arial'; X.fillStyle=colorCycle[(Math.floor(t)+1)%4]; X.fillText('🚫 Pani Waste Na Karain', C.width/2, my+70);
  X.fillStyle=colorCycle[(Math.floor(t)+2)%4]; X.fillText('💙 Pani Zindagi Hai 💙', C.width/2, my+95);
  X.fillStyle='#4CAF50'; X.font='bold 12px Arial'; X.fillText('✅ Nal Band Ho Gaya!', C.width/2, my+120);
}

// LIVING GIRL DRAW FUNCTION - CUTE CARTOON
function drawLivingGirl(gx, gy){
  // Shadow
  X.fillStyle='rgba(0,0,0,0.12)'; X.beginPath(); X.ellipse(gx, gy+32, 22, 6, 0, 0, 6.28); X.fill();
  
  // Legs - sitting
  X.fillStyle='#FFDAB9'; // skin
  X.fillRect(gx-8, gy+8, 7, 18); X.fillRect(gx+3, gy+8, 7, 18);
  // Shoes
  X.fillStyle='#FF69B4'; X.beginPath(); X.ellipse(gx-5, gy+28, 8, 4, 0, 0, 6.28); X.fill();
  X.beginPath(); X.ellipse(gx+7, gy+28, 8, 4, 0, 0, 6.28); X.fill();
  X.fillStyle='white'; X.beginPath(); X.arc(gx-5, gy+27, 2, 0, 6.28); X.arc(gx+7, gy+27, 2, 0, 6.28); X.fill();
  
  // Dress - cute pink frock
  X.fillStyle='#FFB6C1';
  X.beginPath(); X.moveTo(gx-14, gy-8); X.lineTo(gx+14, gy-8); X.lineTo(gx+18, gy+14); X.lineTo(gx-18, gy+14); X.closePath(); X.fill();
  X.fillStyle='#FF69B4'; X.fillRect(gx-14, gy-8, 28, 4); // belt
  X.fillStyle='#FFF'; X.beginPath(); X.arc(gx, gy-6, 3, 0, 6.28); X.fill(); // button
  
  // Arms
  X.fillStyle='#FFDAB9';
  X.beginPath(); X.ellipse(gx-16, gy-2, 4, 9, -0.3, 0, 6.28); X.fill();
  X.beginPath(); X.ellipse(gx+16, gy-2, 4, 9, 0.3, 0, 6.28); X.fill();
  
  // Neck
  X.fillStyle='#FFDAB9'; X.fillRect(gx-4, gy-14, 8, 8);
  
  // Face - cute round
  X.fillStyle='#FFDAB9'; X.beginPath(); X.arc(gx, gy-24, 16, 0, 6.28); X.fill();
  
  // Hair - brown with ponytail
  X.fillStyle='#5D4037';
  X.beginPath(); X.arc(gx, gy-28, 17, Math.PI, Math.PI*2); X.fill(); // top hair
  X.beginPath(); X.ellipse(gx-10, gy-24, 6, 10, -0.2, 0, 6.28); X.fill(); // side
  X.beginPath(); X.ellipse(gx+10, gy-24, 6, 10, 0.2, 0, 6.28); X.fill();
  // Ponytail
  X.beginPath(); X.ellipse(gx+16, gy-20, 7, 6, 0.4, 0, 6.28); X.fill();
  // Bangs
  X.fillStyle='#4E342E'; X.beginPath(); X.ellipse(gx, gy-32, 14, 6, 0, 0, 6.28); X.fill();
  
  // Hair bow
  X.fillStyle='#FF1493'; X.beginPath(); X.ellipse(gx+14, gy-30, 5, 3, 0, 0, 6.28); X.fill();
  X.beginPath(); X.ellipse(gx+18, gy-30, 5, 3, 0, 0, 6.28); X.fill();
  X.beginPath(); X.arc(gx+16, gy-30, 2.5, 0, 6.28); X.fill();
  
  // Eyes - big cute
  X.fillStyle='white'; X.beginPath(); X.ellipse(gx-5, gy-25, 5, 6, 0, 0, 6.28); X.fill();
  X.beginPath(); X.ellipse(gx+5, gy-25, 5, 6, 0, 0, 6.28); X.fill();
  X.fillStyle='#3E2723'; X.beginPath(); X.arc(gx-5, gy-24, 2.8, 0, 6.28); X.fill();
  X.beginPath(); X.arc(gx+5, gy-24, 2.8, 0, 6.28); X.fill();
  X.fillStyle='white'; X.beginPath(); X.arc(gx-4, gy-26, 1.2, 0, 6.28); X.arc(gx+6, gy-26, 1.2, 0, 6.28); X.fill();
  // Eyelashes
  X.strokeStyle='#3E2723'; X.lineWidth=1; 
  X.beginPath(); X.moveTo(gx-9, gy-27); X.lineTo(gx-11, gy-29); X.moveTo(gx-6, gy-29); X.lineTo(gx-6, gy-31);
  X.moveTo(gx+9, gy-27); X.lineTo(gx+11, gy-29); X.moveTo(gx+6, gy-29); X.lineTo(gx+6, gy-31); X.stroke();
  
  // Blush
  X.fillStyle='rgba(255,105,180,0.5)'; X.beginPath(); X.arc(gx-10, gy-20, 3, 0, 6.28); X.arc(gx+10, gy-20, 3, 0, 6.28); X.fill();
  
  // Smile - cute
  let smileOpen=Math.abs(Math.sin(t*0.4+1))*2+1;
  X.fillStyle='#E91E63'; X.beginPath(); X.ellipse(gx, gy-18, 3.5, smileOpen, 0, 0, 6.28); X.fill();
  X.strokeStyle='#C2185B'; X.lineWidth=0.8; X.stroke();
  
  // Breathing animation
  let breathe=Math.sin(t*0.15)*0.8;
  X.fillStyle='rgba(255,255,255,0.0)'; // just for animation
}

function draw(){
t+=0.14; step+=0.2; catX+=catDir*0.8;
let houseW=300, houseH=230;
let hx=C.width-350, hy=C.height-80-houseH;
let houseLeft=hx, houseRight=hx+houseW;
if(catX>houseRight-30) catDir=-1;
if(catX<houseLeft-20) catDir=1;
X.clearRect(0,0,C.width,C.height);
X.fillStyle='#87CEEB';X.fillRect(0,0,C.width,C.height);
X.fillStyle='#7AC87A';X.fillRect(0,C.height-80,C.width,80);
X.fillStyle='#5D4037';X.fillRect(hx-10,C.height-80,houseW+20,12);
tapX=C.width*0.50; tapY=C.height-210;
for(let b of birds){
  b.x+=b.vx; b.wing+=0.35; if(b.x>C.width+30) b.x=-30;
  X.strokeStyle='black';X.lineWidth=1.8;X.lineCap='round';
  let wy=Math.sin(b.wing)*6; X.beginPath();X.moveTo(b.x-10,b.y+wy);X.lineTo(b.x,b.y);X.lineTo(b.x+10,b.y+wy);X.stroke();
}
if(flyingBird && flyingBird.flying){
  flyingBird.wing+=0.45; let targetY=hy-80; let tx=hx+195;
  let dx=tx-flyingBird.x, dy=targetY-flyingBird.y; let dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<10){ flyingBird.flying=false; birdLanded=true; }
  else { flyingBird.x+=dx*0.025; flyingBird.y+=dy*0.025; }
  X.strokeStyle='black';X.lineWidth=2; let wy=Math.sin(flyingBird.wing)*8;
  X.beginPath();X.moveTo(flyingBird.x-12,flyingBird.y+wy);X.lineTo(flyingBird.x,flyingBird.y);X.lineTo(flyingBird.x+12,flyingBird.y+wy);X.stroke();
  X.fillStyle='#6D4C41';X.beginPath();X.arc(flyingBird.x,flyingBird.y,5,0,6.28);X.fill();
}
let sunX=C.width-110, sunY=80;
X.save();X.translate(sunX,sunY);X.rotate(t*0.02);
X.strokeStyle='#FFD700';X.lineWidth=4; for(let i=0;i<12;i++){X.rotate(Math.PI/6);X.beginPath();X.moveTo(48,0);X.lineTo(68,0);X.stroke();}
X.restore();
X.fillStyle='#FFD700';X.beginPath();X.arc(sunX,sunY,40,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(sunX-12,sunY-7,3.5,0,6.28);X.arc(sunX+12,sunY-7,3.5,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.arc(sunX,sunY+8,10,0.2,Math.PI-0.2);X.stroke();

X.fillStyle='#FFF8DC';X.fillRect(hx,hy,houseW,houseH);
X.fillStyle='#E74C3C';X.beginPath();X.moveTo(hx-25,hy);X.lineTo(hx+houseW/2,hy-85);X.lineTo(hx+houseW+25,hy);X.closePath();X.fill();
X.fillStyle='#8B4513';X.fillRect(hx+120,hy+110,55,120);
X.fillStyle='gold';X.beginPath();X.arc(hx+158,hy+160,7,0,6.28);X.fill();
X.fillStyle='#87CEEB';X.strokeStyle='#8B4513';X.lineWidth=3.5;
X.fillRect(hx+20,hy+25,65,65);X.strokeRect(hx+20,hy+25,65,65);
X.fillRect(hx+houseW-85,hy+25,65,65);X.strokeRect(hx+houseW-85,hy+25,65,65);
X.beginPath();X.moveTo(hx+20,hy+57);X.lineTo(hx+85,hy+57);X.moveTo(hx+52,hy+25);X.lineTo(hx+52,hy+90);X.stroke();
X.beginPath();X.moveTo(hx+houseW-85,hy+57);X.lineTo(hx+houseW-20,hy+57);X.moveTo(hx+houseW-52,hy+25);X.lineTo(hx+houseW-52,hy+90);X.stroke();
X.fillStyle='#444';X.fillRect(hx+180,hy-85,36,90);
X.fillStyle='#333';X.fillRect(hx+174,hy-92,48,16);
X.fillStyle='#DDD'; if(tapOpen && !birdLanded){ X.beginPath();X.arc(hx+198,hy-97,18,0,6.28);X.fill(); }
if(birdLanded){
  let bx1=hx+198, by1=hy-99;
  X.fillStyle='#6D4C41';X.beginPath();X.ellipse(bx1,by1,14,8,0,0,6.28);X.fill();
  X.beginPath();X.arc(bx1+9,by1-4,8,0,6.28);X.fill();
  X.fillStyle='#FFA000';X.beginPath();X.moveTo(bx1+17,by1-4);X.lineTo(bx1+23,by1-2);X.lineTo(bx1+17,by1);X.fill();
  X.fillStyle='black';X.beginPath();X.arc(bx1+12,by1-6,1.8,0,6.28);X.fill();
}
X.fillStyle='#999';X.fillRect(tapX-55,tapY,100,18);
X.fillStyle='#777';X.fillRect(tapX+30,tapY-14,18,68);
X.fillStyle=tapOpen?'#E74C3C':'#2ECC71'; X.beginPath();X.arc(tapX+39,tapY+48,18,0,6.28);X.fill();
X.fillStyle='white';X.font='bold 11px Arial';X.fillText(tapOpen?'OPEN':'CLOSE',tapX+17,tapY+52);
if(tapOpen && Math.random()>0.25){ waterParticles.push({x:tapX+39+Math.random()*6-3, y:tapY+60, vy:Math.random()*4+3, vx:Math.random()*0.8-0.4, life:1}); }
for(let i=waterParticles.length-1;i>=0;i--){
  let p=waterParticles[i];
  if(tapOpen || p.y < C.height-80){
    p.y+=p.vy; p.x+=p.vx||0; p.vy+=0.18; p.life-=0.01;
    X.fillStyle=`rgba(33,150,243,${p.life})`; X.beginPath();X.arc(p.x,p.y,7,0,6.28);X.fill();
    if(p.y>C.height-80 || p.life<=0) waterParticles.splice(i,1);
  }
}
if(!tapOpen && waterParticles.length>0 && t%3==0) waterParticles.pop();

// BENCH - STYLISH
let bx=110, by=C.height-155;
X.fillStyle='rgba(0,0,0,0.15)'; X.beginPath(); X.ellipse(bx+75,by+52,65,8,0,0,6.28); X.fill();
X.fillStyle='#2C3E50'; 
X.fillRect(bx+10,by+10,10,42); X.fillRect(bx+130,by+10,10,42);
X.fillRect(bx+10,by-35,10,35); X.fillRect(bx+130,by-35,10,35);
for(let i=0;i<4;i++){
  let grad=X.createLinearGradient(bx,by+i*7,bx,by+i*7+6);
  grad.addColorStop(0,'#8D6E63'); grad.addColorStop(1,'#5D4037');
  X.fillStyle=grad; X.beginPath(); X.roundRect(bx-5,by+i*7,160,6,3); X.fill();
}
for(let i=0;i<3;i++){
  let grad2=X.createLinearGradient(bx,by-38+i*11,bx,by-38+i*11+8);
  grad2.addColorStop(0,'#A1887F'); grad2.addColorStop(1,'#6D4C41');
  X.fillStyle=grad2; X.beginPath(); X.roundRect(bx-5,by-38+i*11,160,8,4); X.fill();
}
X.strokeStyle='#3E2723'; X.lineWidth=4; X.lineCap='round';
X.beginPath(); X.moveTo(bx-5,by-30); X.quadraticCurveTo(bx-12,by-10,bx-5,by+10); X.stroke();
X.beginPath(); X.moveTo(bx+155,by-30); X.quadraticCurveTo(bx+162,by-10,bx+155,by+10); X.stroke();

// === LIVING GIRL - AB STICK NAHI ===
let girlX=bx+75, girlY=by-8;
drawLivingGirl(girlX, girlY);

let cy=C.height-88;
let catWalk=Math.sin(step*1.5)*6; let tailWag=Math.sin(t)*1.3;
X.fillStyle='#FFA500'; X.beginPath();X.ellipse(catX,cy-5,20,11,0,0,6.28);X.fill();
X.fillStyle='#FF8C00'; X.beginPath();X.ellipse(catX-9+catWalk*0.3,cy+2,4.5,7,0,0,6.28);X.fill();
X.beginPath();X.ellipse(catX+9-catWalk*0.3,cy+2,4.5,7,0,0,6.28);X.fill();
X.fillStyle='#FFA500';X.beginPath();X.arc(catX+20*catDir,cy-13,13,0,6.28);X.fill();
X.beginPath();X.moveTo(catX+13*catDir,cy-21);X.lineTo(catX+11*catDir,cy-32);X.lineTo(catX+20*catDir,cy-23);X.fill();
X.beginPath();X.moveTo(catX+25*catDir,cy-21);X.lineTo(catX+27*catDir,cy-32);X.lineTo(catX+31*catDir,cy-23);X.fill();
X.fillStyle='pink';X.beginPath();X.arc(catX+14*catDir,cy-24,2.8,0,6.28);X.arc(catX+26*catDir,cy-24,2.8,0,6.28);X.fill();
X.fillStyle='green';X.beginPath();X.arc(catX+24*catDir,cy-15,3.2,0,6.28);X.arc(catX+30*catDir,cy-15,3.2,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(catX+24*catDir,cy-15,1.1,0,6.28);X.arc(catX+30*catDir,cy-15,1.1,0,6.28);X.fill();
X.strokeStyle='#FF8C00';X.lineWidth=7;X.lineCap='round';
X.beginPath();X.moveTo(catX-20,cy-5); X.quadraticCurveTo(catX-30+tailWag*9,cy-13,catX-36,cy-2);X.stroke();
let sy2=C.height-80;
if(storyState==0){ if(sx2 < tapX-60){ sx2+=1.9; } else { storyState=1; closeProgress=0; } }
if(storyState==1){ closeProgress+=0.04; if(closeProgress>=1){ tapOpen=false; showCanvasMsg=true; storyState=2; } }
let leg1=Math.sin(step)*16, leg2=Math.sin(step+Math.PI)*16;
let reachingArm = storyState==1 ? 18+closeProgress*32 : 0;
X.strokeStyle='black';X.lineWidth=3.4;
X.beginPath();X.arc(sx2,sy2-88,19,0,6.28);X.stroke();
X.beginPath();X.moveTo(sx2,sy2-69);X.lineTo(sx2,sy2-32);X.stroke();
if(storyState==1){
  X.beginPath();X.moveTo(sx2,sy2-57);X.lineTo(sx2+reachingArm,sy2-42);X.stroke();
  X.beginPath();X.moveTo(sx2,sy2-57);X.lineTo(sx2-16,sy2-42);X.stroke();
} else {
  X.beginPath();X.moveTo(sx2,sy2-57);X.lineTo(sx2-20,sy2-44);X.moveTo(sx2,sy2-57);X.lineTo(sx2+20,sy2-44);X.stroke();
}
X.beginPath();X.moveTo(sx2,sy2-32);X.lineTo(sx2-9+leg1*0.6,sy2);X.moveTo(sx2,sy2-32);X.lineTo(sx2+9+leg2*0.6,sy2);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(sx2-6,sy2-93,2.2,0,6.28);X.arc(sx2+6,sy2-93,2.2,0,6.28);X.fill();
let m2=storyState==1?2:Math.abs(Math.sin(t*0.6))*6+1;
X.fillStyle='#FF4444';X.beginPath();X.ellipse(sx2,sy2-80,6.5,m2,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1.1;X.stroke();
if(showCanvasMsg){ drawCanvasMessage(); }
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
