<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pani Bachao - Stickman Story</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:cursive}
canvas{width:100vw;height:100vh;display:block}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px 30px;border-radius:15px;border:4px solid #2196F3;display:none;text-align:center;z-index:20;box-shadow:0 0 20px rgba(0,0,0,0.5)}
#msg h2{color:#2196F3;margin:0 0 10px}
#msg p{margin:5px 0;font-weight:bold}
#replay{margin-top:10px;padding:8px 15px;background:#2196F3;color:white;border:none;border-radius:8px;cursor:pointer}
h1{position:fixed;top:8px;width:100%;text-align:center;color:#333;z-index:10;font-size:20px}
</style>
</head>
<body>
<h1>💧 Pani Bachao - Stickman Story 💧</h1>
<div id="msg">
<h2>💧 PANI BACHAO! 💧</h2>
<p>🚫 Pani Waste Na Karain</p>
<p>💙 Pani Zindagi Hai 💙</p>
<p style="font-size:12px;color:green">Stickman ne nal band kar diya!</p>
<button id="replay" onclick="resetStory()">Dobara Dekho 🔄</button>
</div>
<canvas id="c"></canvas>
<script>
let C=document.getElementById('c'),X=C.getContext('2d');
function R(){C.width=innerWidth;C.height=innerHeight}R();
addEventListener('resize',R);
let t=0, sx2=80, dir=1, step=0;
let tapOpen=true, waterParticles=[], storyState=0, closeProgress=0;
let tapX=0, tapY=0;

function resetStory(){
  tapOpen=true; storyState=0; closeProgress=0; sx2=80; dir=1;
  waterParticles=[]; document.getElementById('msg').style.display='none';
  for(let i=0;i<20;i++) waterParticles.push({x:0,y:0,vy:Math.random()*3+2});
}
resetStory();

function draw(){
t+=0.14; step+=0.18;
X.clearRect(0,0,C.width,C.height);
X.fillStyle='#87CEEB';X.fillRect(0,0,C.width,C.height);
X.fillStyle='#7AC87A';X.fillRect(0,C.height-80,C.width,80);

tapX=C.width*0.6; tapY=C.height-180;

// === SURAJ ===
let sunX=C.width-110, sunY=85;
X.save();X.translate(sunX,sunY);X.rotate(t*0.02);
X.strokeStyle='#FFD700';X.lineWidth=4;
for(let i=0;i<12;i++){X.rotate(Math.PI/6);X.beginPath();X.moveTo(45,0);X.lineTo(65,0);X.stroke();}
X.restore();
X.fillStyle='#FFD700';X.beginPath();X.arc(sunX,sunY,40,0,6.28);X.fill();
X.fillStyle='black';X.beginPath();X.arc(sunX-12,sunY-7,3.5,0,6.28);X.arc(sunX+12,sunY-7,3.5,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=2;X.beginPath();X.arc(sunX,sunY+8,10,0.2,Math.PI-0.2);X.stroke();

// === MESSAGE BOARD ===
let boardX=20, boardY=100;
X.fillStyle='#2196F3';X.fillRect(boardX,boardY,190,80);
X.fillStyle='white';X.strokeStyle='#0D47A1';X.lineWidth=3;X.strokeRect(boardX,boardY,190,80);
X.font='bold 15px Arial';X.fillText('💧 PANI BACHAO 💧',boardX+15,boardY+25);
X.font='bold 12px Arial';X.fillText('Nal Khula Hai!',boardX+45,boardY+50);
if(!tapOpen) {X.fillText('✅ Band Ho Gaya!',boardX+35,boardY+68);}

// === BADA GHAR Right Side ===
let hx=C.width-180, hy=C.height-240;
X.fillStyle='#FFE4B5';X.fillRect(hx,hy,140,120);
X.fillStyle='#E74C3C';X.beginPath();X.moveTo(hx-12,hy);X.lineTo(hx+70,hy-45);X.lineTo(hx+152,hy);X.closePath();X.fill();
X.fillStyle='#8B4513';X.fillRect(hx+55,hy+60,30,60);
X.fillStyle='#87CEEB';X.strokeStyle='#8B4513';X.lineWidth=2;
X.fillRect(hx+10,hy+15,28,28);X.strokeRect(hx+10,hy+15,28,28);
X.fillRect(hx+102,hy+15,28,28);X.strokeRect(hx+102,hy+15,28,28);
X.fillStyle='#555';X.fillRect(hx+100,hy-30,14,38);

// === TAP / NAL ===
X.fillStyle='#999';X.fillRect(tapX-40,tapY,80,15); // pipe
X.fillStyle='#777';X.fillRect(tapX+25,tapY-10,15,50); // vertical
// tap head
X.fillStyle=tapOpen?'#E74C3C':'#2ECC71'; // red if open, green if closed
X.beginPath();X.arc(tapX+32,tapY+35,14,0,6.28);X.fill();
X.fillStyle='white';X.font='bold 10px Arial';X.fillText(tapOpen?'OPEN':'CLOSE',tapX+12,tapY+39);

// === PANI GIRTA HUA - Like Life ===
if(tapOpen){
  if(Math.random()>0.3){
    waterParticles.push({x:tapX+32+Math.random()*8-4, y:tapY+48, vy:Math.random()*4+3, vx:Math.random()*1-0.5, life:1});
  }
}
for(let i=waterParticles.length-1;i>=0;i--){
  let p=waterParticles[i];
  if(tapOpen || p.y < C.height-80){
    p.y+=p.vy; p.x+=p.vx||0; p.vy+=0.15; p.life-=0.008;
    X.fillStyle=`rgba(33,150,243,${p.life})`;
    X.beginPath();X.arc(p.x,p.y,5,0,6.28);X.fill();
    // chamak
    X.fillStyle=`rgba(173,216,255,${p.life})`;
    X.beginPath();X.arc(p.x-1,p.y-1,2,0,6.28);X.fill();
    if(p.y>C.height-80 || p.life<=0) waterParticles.splice(i,1);
  }
}
if(!tapOpen && waterParticles.length>0 && t%2==0) waterParticles.pop();

// === BENCH & AURAT & BILI ===
let bx=C.width*0.5-180, by=C.height-140;
X.fillStyle='#8B4513';X.fillRect(bx,by,120,6);X.fillRect(bx,by+22,120,6);
X.fillRect(bx+6,by+6,10,30);X.fillRect(bx+104,by+6,10,30);
let wx=bx+60, wy=by;
X.strokeStyle='black';X.lineWidth=3;X.beginPath();X.arc(wx,wy-32,12,0,6.28);X.stroke();
X.beginPath();X.moveTo(wx,wy-20);X.lineTo(wx,wy+2);X.stroke();
X.beginPath();X.moveTo(wx-10,wy+2);X.lineTo(wx+10,wy+2);X.lineTo(wx+8,wy+12);X.lineTo(wx-8,wy+12);X.closePath();X.stroke();
X.fillStyle='black';X.beginPath();X.arc(wx-4,wy-35,1.5,0,6.28);X.arc(wx+4,wy-35,1.5,0,6.28);X.fill();
let m1=Math.abs(Math.sin(t*0.4))*4+1;
X.fillStyle='#FF3366';X.beginPath();X.ellipse(wx,wy-27,4,m1,0,0,6.28);X.fill();

let cx=bx+150, cy=C.height-85;
let tailWag=Math.sin(t)*1;
X.fillStyle='orange';X.beginPath();X.arc(cx,cy-12,10,0,6.28);X.fill();
X.beginPath();X.ellipse(cx,cy,13,7,0,0,6.28);X.fill();
X.strokeStyle='orange';X.lineWidth=4;X.beginPath();X.moveTo(cx+12,cy);
X.quadraticCurveTo(cx+20+tailWag*8,cy-8,cx+28,cy+2);X.stroke();

// === STICKMAN CHALTA HUA - HERO ===
let sy2=C.height-80;
if(storyState==0){ // chal raha hai tap ki taraf
  if(sx2 < tapX-50){ sx2+=1.8; dir=1; }
  else { storyState=1; closeProgress=0; }
}
if(storyState==1){ // band kar raha hai
  closeProgress+=0.03;
  if(closeProgress>=1){ tapOpen=false; storyState=2; setTimeout(()=>{document.getElementById('msg').style.display='block'; storyState=3;},800); }
}
let leg1=Math.sin(step)*16, leg2=Math.sin(step+Math.PI)*16;
let arm1=Math.sin(step)*12, arm2=Math.sin(step+Math.PI)*12;
let reachingArm = storyState==1 ? 20+closeProgress*25 : 0;

X.strokeStyle='black';X.lineWidth=3.2;
X.beginPath();X.arc(sx2,sy2-85,18,0,6.28);X.stroke();
X.beginPath();X.moveTo(sx2,sy2-67);X.lineTo(sx2,sy2-30);X.stroke();
if(storyState==1){
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2+reachingArm,sy2-45);X.stroke();
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2-15,sy2-40);X.stroke();
} else {
  X.beginPath();X.moveTo(sx2,sy2-55);X.lineTo(sx2-18+arm1*0.2,sy2-42);X.moveTo(sx2,sy2-55);X.lineTo(sx2+18+arm2*0.2,sy2-42);X.stroke();
}
X.beginPath();X.moveTo(sx2,sy2-30);X.lineTo(sx2-8+leg1*0.6,sy2);X.moveTo(sx2,sy2-30);X.lineTo(sx2+8+leg2*0.6,sy2);X.stroke();
X.fillStyle='black';X.beginPath();X.arc(sx2-6,sy2-90,2,0,6.28);X.arc(sx2+6,sy2-90,2,0,6.28);X.fill();
let m2= storyState==1 ? 2 : Math.abs(Math.sin(t*0.6))*6+1;
X.fillStyle='#FF4444';X.beginPath();X.ellipse(sx2,sy2-78,6,m2,0,0,6.28);X.fill();
X.strokeStyle='black';X.lineWidth=1;X.stroke();

requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
