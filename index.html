<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pani Bachao Story</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
#stage{width:360px;height:640px;background:linear-gradient(to bottom, #87CEEB 0%, #FFD580 100%);border:4px solid white;border-radius:20px;position:relative;overflow:hidden}
.sun{position:absolute;width:70px;height:70px;background:#FFD700;border-radius:50%;box-shadow:0 0 30px #FFD700;animation: sunrise 4s infinite alternate}
@keyframes sunrise{0%{top:400px;left:20px}100%{top:30px;left:40px}}
.house{position:absolute;bottom:100px;left:80px;width:200px;height:150px;background:#DEB887;border:3px solid #8B4513}
.roof{position:absolute;top:-40px;left:-10px;width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-bottom:50px solid #8B0000}
.door{position:absolute;bottom:0;left:70px;width:50px;height:80px;background:#8B4513}
.tap{position:absolute;bottom:100px;left:20px;font-size:40px}
.water{position:absolute;bottom:20px;left:30px;width:10px;background:#00BFFF;animation: waste 1s infinite linear}
@keyframes waste{0%{height:0;top:200px}100%{height:80px;top:280px}}
.cloud{position:absolute;top:20px;font-size:30px;animation: movecloud 6s infinite linear}
@keyframes movecloud{0%{left:-50px}100%{left:360px}}
.text{position:absolute;bottom:15px;left:5%;width:90%;background:white;padding:12px;border-radius:15px;text-align:center;font-weight:bold}
button{margin-top:15px;padding:12px 30px;border-radius:25px;border:none;background:#27ae60;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="stage">
<div class="sun"></div>
<div class="cloud" style="top:30px">☁️</div>
<div class="cloud" style="top:60px; animation-delay:2s">☁️</div>
<div class="tap">🚰</div>
<div class="water"></div>
<div class="house">
<div class="roof"></div>
<div class="door"></div>
</div>
<div class="text" id="t">Sun is Rising... Subah ho gayi!</div>
</div>
<button onclick="next()">Next →</button>
<script>
let s=0;
let lines=["Sun is Rising... Subah ho gayi! ☀️","Ghar me Nal khula reh gaya! 🚰","Paani waste ho raha hai! 💧","Arre paani bachao! Jaldi band karo!","Pani bach gaya! Good Job! ❤️"];
function next(){s=(s+1)%lines.length;document.getElementById('t').innerText=lines[s]}
</script>
</body>
</html>
