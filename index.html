<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehndi Aur Laddu - Saas Bahu Story</title>
<style>
body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
#stage{
 width:360px;height:640px;
 background-image: url('./mehndi.jpg');
 background-size: cover;
 background-position: center top;
 border:4px solid #fff;border-radius:20px;
 position:relative;overflow:hidden;
}
.overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.6) 20%, transparent 60%)}
.dialog{position:absolute;bottom:20px;left:5%;width:90%;background:rgba(255,255,255,0.95);padding:14px;border-radius:15px;text-align:center;font-weight:bold;font-size:17px;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.title{position:absolute;top:15px;left:5%;width:90%;background:#ff4757;color:white;padding:8px;border-radius:10px;text-align:center;font-weight:bold;font-size:14px}
button{margin-top:15px;padding:14px 40px;font-size:17px;border-radius:30px;border:none;background:#8e44ad;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="stage">
 <div class="overlay"></div>
 <div class="title">Mehndi Aur Laddu Part 2 - Saas Bahu Story</div>
 <div class="dialog" id="d">Saas: Are Bahu, ye laddu kisne khaye?</div>
</div>
<button onclick="next()">Next Scene →</button>
<script>
let i=0;
let lines=[
"Saas: Are Bahu, ye laddu kisne khaye?",
"Bahu: Amma ji maine nahi, choti ne khaye honge!",
"Saas: Haye itne saare laddu, mehndi kharab ho jayegi!",
"Bahu: Amma ji tension nahi, mehndi ke baad laddu aur meethay lagte hain!",
"4ro Khush! Mehndi Aur Laddu Party! ❤️"
];
function next(){
 i=(i+1)%lines.length;
 document.getElementById('d').innerText=lines[i];
}
</script>
</body>
</html>
