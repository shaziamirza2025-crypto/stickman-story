<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suraj with Eyes</title><style>body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:4px solid white;border-radius:15px}</style></head><body><canvas id="c" width="360" height="640"></canvas><script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
let t=0;
let flowers=[]; for(let i=0;i<30;i++){flowers.push({x:10+Math.random()*130, y:400+Math.random()*160, type:Math.floor(Math.random()*3)})}

function draw(){
 t+=0.05;
 x.fillStyle="#87CEEB"; x.fillRect(0,0,360,360);
 x.fillStyle="#7CFC00"; x.fillRect(0,360,360,280);

 // SUN WITH RAYS AND EYES ☀️👀
 let sunX=280, sunY=80;
 // Kirnein - chamakti hui
 x.strokeStyle="rgba(255,215,0,0.8)"; x.lineWidth=3;
 for(let i=0;i<12;i++){
   let ang=(i/12)*Math.PI*2 + t*0.5;
   let len=15+Math.sin(t*3+i)*8;
   x.beginPath();
   x.moveTo(sunX+Math.cos(ang)*35, sunY+Math.sin(ang)*35);
   x.lineTo(sunX+Math.cos(ang)*(45+len), sunY+Math.sin(ang)*(45+len));
   x.stroke();
 }
 // Suraj ka gol face
 x.fillStyle="#FFD700"; x.beginPath(); x.arc(sunX,sunY,32,0,7); x.fill();
 x.fillStyle="#FFA500"; x.beginPath(); x.arc(sunX,sunY,28,0,7); x.fill();
 x.fillStyle="#FFFF00"; x.beginPath(); x.arc(sunX,sunY,22,0,7); x.fill();
 // Ankhein 👀
 x.fillStyle="white"; x.beginPath(); x.arc(sunX-8,sunY-5,7,0,7); x.arc(sunX+8,sunY-5,7,0,7); x.fill();
 x.fillStyle="black"; x.beginPath(); x.arc(sunX-8+Math.sin(t)*2,sunY-4,3,0,7); x.arc(sunX+8+Math.sin(t)*2,sunY-4,3,0,7); x.fill();
 x.fillStyle="white"; x.beginPath(); x.arc(sunX-7,sunY-6,1.5,0,7); x.arc(sunX+9,sunY-6,1.5,0,7); x.fill();
 // Muskurahat 😊
 x.strokeStyle="black"; x.lineWidth=2; x.beginPath(); x.arc(sunX,sunY+8,10,0.2,Math.PI-0.2); x.stroke();
 // Gaal laal
 x.fillStyle="rgba(255,100,100,0.5)"; x.beginPath(); x.arc(sunX-14,sunY+5,4,0,7); x.arc(sunX+14,sunY+5,4,0,7); x.fill();

 // House
 x.fillStyle="#FFE4B5"; x.fillRect(150,200,190,160); x.strokeStyle="#8B4513"; x.lineWidth=3; x.strokeRect(150,200,190,160);
 x.fillStyle="#B22222"; x.beginPath(); x.moveTo(140,200); x.lineTo(245,130); x.lineTo(350,200); x.closePath(); x.fill(); x.stroke();
 x.fillStyle="#8B4513"; x.fillRect(230,290,45,70);

 // Garden Peeche
 flowers.forEach(fl=>{
   x.strokeStyle="green"; x.lineWidth=2; x.beginPath(); x.moveTo(fl.x,fl.y); x.lineTo(fl.x,fl.y+12); x.stroke();
   if(fl.type==0){ x.fillStyle="#FF69B4"; x.beginPath(); x.arc(fl.x,fl.y,6,0,7); x.fill(); }
   else if(fl.type==1){ x.fillStyle="red"; x.beginPath(); x.arc(fl.x,fl.y,5,0,7); x.fill(); }
   else{ x.fillStyle="#FFD700"; x.beginPath(); x.arc(fl.x,fl.y,5,0,7); x.fill(); }
 });
 // Darakht Aage
 x.fillStyle="#8B4513"; x.fillRect(25,380,14,50); x.fillStyle="#228B22"; x.beginPath(); x.arc(32,370,30,0,7); x.fill();
 x.fillStyle="#8B4513"; x.fillRect(105,390,12,40); x.fillStyle="#2E8B57"; x.beginPath(); x.arc(111,380,25,0,7); x.fill();

 requestAnimationFrame(draw);
}
draw();
</script></body></html>
